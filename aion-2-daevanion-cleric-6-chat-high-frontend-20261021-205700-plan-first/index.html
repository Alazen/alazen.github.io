ss="pager weights-pager"><button data-weight-page="-1" ${p===0?'disabled':''}>Previous</button><span>${p+1} / ${pages}</span><button data-weight-page="1" ${p===pages-1?'disabled':''}>Next</button></div></div></section>`;

function splitSummaryRows(text,kind){if(!text)return[];if(kind==='skills'){const entries=text.includes(';')?text.split(';'):text.split(/,\s+(?=[A-Z])/);return entries.map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*)\s+(\d+)$/);return m?{name:m[1],value:m[2]}:{name:x,value:''}})}return text.split(';').map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)\s+(\+[\d.]+%?)$/);return m?{name:m[1],value:m[2]}:{name:x,value:''}})}
