<script>
'use strict';
const builds=JSON.parse(document.getElementById('build-data').textContent);
const el=id=>document.getElementById(id);
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=builds.find(b=>b.id===location.hash.slice(1))||builds[0];
let selected=1,page=0,pageSize=8;
let focusPage=false;
const groups=new Map();
for(const b of builds){if(!groups.has(b.group))groups.set(b.group,[]);groups.get(b.group).push(b);}
for(const [label,items] of groups){
 const group=document.createElement('optgroup');group.label=label;
 for(const b of items){const option=document.createElement('option');option.value=b.id;option.textContent=b.summary?`${b.role} · ${b.budget} points`:`${b.role} · ${b.budget} points · ${b.board}`;group.appendChild(option);}
 el('build-select').appendChild(group);
}
const compactDirection=text=>text.replace(/(\d+) (up|down|left|right)/g,(_,n,d)=>`<span>${{up:'↑',down:'↓',left:'←',right:'→'}[d]} ${n}</span>`);
function announce(text){el('announce').textContent=text;}
function setBuild(id,updateHash=true){
 const found=builds.find(b=>b.id===id);if(!found)return;
 current=found;selected=1;page=0;
 el('build-select').value=current.id;
 if(updateHash){try{history.replaceState(null,'','#'+current.id);}catch(e){}}
 el('workspace').classList.toggle('summary-mode',current.summary);
 el('board-title').textContent=current.summary?current.role:current.board;
 el('build-context').textContent=current.summary?`${current.budget}-point build · published totals`:`${current.role} · ${current.budget}-point build`;
 el('point-total').textContent=current.points;
 el('point-label').textContent=current.summary?'total points':'board points';
 el('table-title').textContent=current.summary?'Build totals':'Purchase order';
 el('table-meta').textContent=current.summary?`${current.rows.length} published results`:`${current.rows.length} nodes · ${current.points} points`;
 el('table-caption').textContent=current.summary?`${current.role}, ${current.budget}-point published allocation, skill levels and stat totals`:`${current.role}, ${current.budget}-point build, ${current.board}: numbered purchases, node costs, cumulative spend and coordinates`;
 el('table-head').innerHTML=current.summary?'<tr><th scope="col">Allocation / upgrade</th><th scope="col">Result</th><th scope="col">Detail</th></tr>':'<tr><th scope="col">No.</th><th scope="col">Upgrade</th><th scope="col">Cost</th><th scope="col">Spent</th><th scope="col">From start</th></tr>';
 el('source-note').textContent=current.summary?'The source publishes totals for this budget, without a click-order map.':current.board==='Azphel'?'Azphel uses a separate crystal pool. Per-node costs are unlisted in the source.':'Positions count from the free center. Buy nodes in numbered order.';
 renderBoard();renderDetail();fitRows();
 announce(`${current.role}, ${current.budget} points, ${current.board}. ${current.rows.length} rows.`);
}
function renderBoard(){
 if(current.summary){
  const names=current.budget===100?['Azphel']:['Nezekan','Zikel','Vaizel','Triniel'];
  el('board-wrap').innerHTML='<div class="summary-chart"><h3>Where the points go</h3>'+current.allocation.map((pts,i)=>`<div class="allocation"><span>${names[i]}</span><div class="bar" aria-hidden="true"><i style="width:${pts/current.budget*100}%"></i></div><strong>${pts}</strong></div>`).join('')+'</div>';
  return;
 }
 const grid=current.grid;const start=grid.find(n=>n.order==='S');
 const minX=Math.min(...grid.map(n=>n.x)),maxX=Math.max(...grid.map(n=>n.x)),minY=Math.min(...grid.map(n=>n.y)),maxY=Math.max(...grid.map(n=>n.y));
 const cols=maxX-minX+1,rows=maxY-minY+1,step=32,off=22;
 const px=x=>off+(x-minX)*step,py=y=>off+(y-minY)*step;
 const width=(cols-1)*step+off*2,height=(rows-1)*step+off*2;
 let svg=`<svg class="board" viewBox="0 0 ${width} ${height}" role="group" aria-label="${escapeHTML(current.board)} node map. S is the free center. Select a numbered node to locate its table row.">`;
 const owned=grid.filter(n=>typeof n.order==='number'||n.order==='S');
 for(const a of owned)for(const b of owned){
  if((b.x===a.x+1&&b.y===a.y)||(b.y===a.y+1&&b.x===a.x))svg+=`<path class="edge" d="M${px(a.x)} ${py(a.y)}L${px(b.x)} ${py(b.y)}"/>`;
 }
 for(const n of grid){
  const x=px(n.x),y=py(n.y);
  if(n.order==='.')svg+=`<circle class="unbought" cx="${x}" cy="${y}" r="1.8"/>`;
  else if(n.order==='S')svg+=`<circle cx="${x}" cy="${y}" r="11" fill="#221b35"/><text x="${x}" y="${y+3.5}" text-anchor="middle" fill="#b8acf7" font-family="Arial" font-size="11">S</text>`;
  else{
   const r=current.rows[n.order-1];
   svg+=`<g class="node${n.order===selected?' active':''}${r.kind==='Corner'?' corner':''}" data-order="${n.order}" tabindex="${n.order===selected?'0':'-1'}" role="button" aria-label="Purchase ${n.order}: ${escapeHTML(r.name)}, ${escapeHTML(r.direction)}" aria-pressed="${n.order===selected}"><rect class="node-hit" x="${x-15}" y="${y-15}" width="30" height="30"/><rect class="tile" x="${x-11}" y="${y-11}" width="22" height="22" rx="${r.kind==='Stat'?2:5}"/><text x="${x}" y="${y+3.6}" text-anchor="middle">${n.order}</text></g>`;
  }
 }
 svg+='</svg>';el('board-wrap').innerHTML=svg;
}
function renderDetail(){
 if(current.summary){
  el('detail').innerHTML=`<div class="detail-top">Published summary</div><h3>${current.budget===100?'Separate Azphel crystals':'One shared crystal pool'}</h3><p>No node order is provided for this budget. Use the table for exact allocations, levels and stats.</p>`;
  return;
 }
 const row=current.rows[selected-1];
 el('detail').innerHTML=`<div class="detail-top"><span class="detail-num">${String(row.order).padStart(2,'0')}</span><span>${escapeHTML(row.kind)} node</span></div><h3>${escapeHTML(row.name)}</h3><p>${escapeHTML(row.direction)} from start${row.cost===null?' · Cost unlisted':` · ${row.cost} point${row.cost===1?'':'s'}`}</p><div class="legend" aria-label="Map legend"><span><i class="symbol skill" aria-hidden="true"></i>Skill</span><span><i class="symbol corner" aria-hidden="true"></i>Corner</span><span class="start-legend"><i class="symbol start-dot" aria-hidden="true"></i>S: Start</span></div>`;
}
function renderTable(){
 const count=current.rows.length;const pages=Math.ceil(count/pageSize);page=Math.max(0,Math.min(page,pages-1));
 const from=page*pageSize,to=Math.min(count,from+pageSize);
 const html=current.rows.slice(from,to).map(r=>{
  if(current.summary)return `<tr><td>${escapeHTML(r.name)}<span class="summary-kind">${escapeHTML(r.kind)}</span></td><td>${escapeHTML(r.result)}</td><td>${escapeHTML(r.detail)}</td></tr>`;
  return `<tr class="${r.order===selected?'chosen':''}" aria-current="${r.order===selected?'true':'false'}"><td>${String(r.order).padStart(2,'0')}</td><td><button class="row-button" type="button" data-order="${r.order}" aria-label="Locate purchase ${r.order}: ${escapeHTML(r.name)}" aria-pressed="${r.order===selected}"><i aria-hidden="true" class="symbol ${r.kind}"></i><span class="name">${escapeHTML(r.name)}<span class="kind-label"><span class="type">${r.kind}</span><span class="mobile-position">${escapeHTML(r.direction)}</span></span></span></button></td><td>${r.cost===null?'<span aria-label="Cost unlisted">n/a</span>':r.cost}</td><td>${r.points===null?'<span aria-label="Cumulative points unlisted">n/a</span>':`<span class="spent" style="--percent:${r.points/current.points*100}%">${r.points}</span>`}</td><td class="pos" aria-label="${escapeHTML(r.direction)}">${compactDirection(r.direction)}</td></tr>`;
 }).join('');
 el('table-body').innerHTML=html;
 el('range').textContent=`${current.summary?'Rows':'Nodes'} ${from+1}–${to} of ${count}`;
 el('page-number').textContent=`${page+1} / ${pages}`;
 el('prev').disabled=page===0;el('next').disabled=page>=pages-1;
 if(focusPage){el('table-space').focus({preventScroll:true});focusPage=false;}
}
function fitRows(){
 const space=el('table-space').getBoundingClientRect().height;
 const isMobile=innerWidth<=800;
 const base=innerHeight<=460?60:innerWidth<1150?64:52;
 const needed=Math.max(1,Math.floor((space-35)/base));
 const oldSize=pageSize;
 pageSize=needed;
 document.documentElement.style.setProperty('--row',base+'px');
 if(!current.summary&&oldSize!==pageSize)page=Math.floor((selected-1)/pageSize);
 renderTable();
 // A wrapped skill name may need more height than the nominal row. Reduce rows until all visible content fits.
 while(pageSize>1&&el('build-table').getBoundingClientRect().height>space+1){
  pageSize--;if(!current.summary)page=Math.floor((selected-1)/pageSize);renderTable();
 }
}
function selectNode(order,focusMap=false){
 if(current.summary)return;
 selected=Math.max(1,Math.min(current.rows.length,order));
 page=Math.floor((selected-1)/pageSize);
 renderTable();renderDetail();
 for(const node of el('board-wrap').querySelectorAll('.node')){
  const active=Number(node.dataset.order)===selected;
  node.classList.toggle('active',active);node.setAttribute('aria-pressed',String(active));node.setAttribute('tabindex',active?'0':'-1');
  if(active&&focusMap)node.focus({preventScroll:true});
 }
 const r=current.rows[selected-1];announce(`Purchase ${r.order}: ${r.name}. ${r.direction} from start. ${r.points===null?'Node cost unlisted.':`${r.cost} points; ${r.points} points spent on this board.`}`);
}
el('build-select').addEventListener('change',e=>setBuild(e.target.value));
el('prev').addEventListener('click',()=>changePage(-1));el('next').addEventListener('click',()=>changePage(1));
function changePage(dir){page+=dir;const first=page*pageSize+1;if(!current.summary){selectNode(first);}else renderTable();announce(el('range').textContent);}
el('table-body').addEventListener('click',e=>{const row=e.target.closest('button[data-order]');if(row){const n=Number(row.dataset.order);selectNode(n);el('table-body').querySelector(`[data-order="${n}"]`).focus({preventScroll:true});}});
el('board-wrap').addEventListener('click',e=>{const node=e.target.closest('[data-order]');if(node)selectNode(Number(node.dataset.order));});
el('board-wrap').addEventListener('keydown',e=>{
 const node=e.target.closest('[data-order]');if(!node)return;
 let next=selected;
 if(e.key==='Enter'||e.key===' '){e.preventDefault();selectNode(Number(node.dataset.order),true);return;}
 if(e.key==='ArrowRight'||e.key==='ArrowDown')next++;
 else if(e.key==='ArrowLeft'||e.key==='ArrowUp')next--;
 else if(e.key==='Home')next=1;else if(e.key==='End')next=current.rows.length;else return;
 e.preventDefault();selectNode(next,true);
});
window.addEventListener('hashchange',()=>setBuild(location.hash.slice(1),false));
let resizeFrame;new ResizeObserver(()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(fitRows);}).observe(el('table-space'));
setBuild(current.id,false);

</script>
