}
function classify(name){
 if(/\+1\.5%|Damage Boost|Damage Tolerance|Combat Speed|Cooldown Reduction|Multi-Hit/.test(name))return 'corner';
 const words=data.positions.slice(1).map(r=>r[0]);
 if(words.includes(name)||words.some(w=>w===name.replace(/ \+1$/,'')))return 'skill';
 if(!/\+\d/.test(name))return 'skill';
 return 'stat';
}
function boardFact(){const row=data.overview.find(r=>r[0]===state.board);return row?`Unlock level ${esc(row[1])}. ${esc(row[3])} points to fill. ${esc(row[4])}.`:''}
function boardSVG(board){
 const cells=board.cells, rows=cells.map(c=>c[0]),cols=cells.map(c=>c[1]);
 const loR=Math.min(...rows),hiR=Math.max(...rows),loC=Math.min(...cols),hiC=Math.max(...cols);
 const cell=40,pad=24,w=(hiC-loC+1)*cell+pad*2,h=(hiR-loR+1)*cell+pad*2;
 const xy=(r,c)=>[pad+(c-loC+.5)*cell,pad+(r-loR+.5)*cell];
 const [cx,cy]=xy(8,8),radius=Math.min(w,h)*.46;
 const positions=new Map(board.steps.map(s=>[s.n,[s.row,s.col]]));
 const owned=new Map([[0,[8,8]]]);
 let edges='';
 for(const step of board.steps){
  const candidate=[...owned].filter(([,p])=>Math.abs(p[0]-step.row)+Math.abs(p[1]-step.col)===1).sort((a,b)=>b[0]-a[0])[0];
  if(candidate){const [x1,y1]=xy(...candidate[1]),[x2,y2]=xy(step.row,step.col);let cl=step.n===state.step?'current':step.n<state.step?'past':'future';edges+=`<line class="edge ${cl}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}
  owned.set(step.n,[step.row,step.col]);
 }
 let dots='',nodes='';
 for(const [r,c,v] of cells){const [x,y]=xy(r,c);if(v==='.')dots+=`<circle class="dormant" cx="${x}" cy="${y}" r="2.8"/>`;else if(v==='S')nodes+=`<g class="start"><circle cx="${x}" cy="${y}" r="15"/><text x="${x}" y="${y+1}">S</text></g>`;else{
  const n=Number(v),step=board.steps[n-1],cl=n===state.step?'active':n>state.step?'future':'past',kind=classify(step.name);
  nodes+=`<g class="node ${cl} ${kind}" data-step="${n}" tabindex="0" role="button" aria-label="Click ${n}: ${esc(step.name)}" aria-current="${n===state.step?'step':'false'}"><circle cx="${x}" cy="${y}" r="${n===state.step?18.5:16}"/><text x="${x}" y="${y+1}">${n}</text></g>`;
 }}
 const selected=board.steps[state.step-1],[sx,sy]=xy(selected.row,selected.col);
 return `<svg class="board-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(state.board)} board map with ${board.steps.length} numbered clicks"><g class="orbit"><circle cx="${w/2}" cy="${h/2}" r="${radius}"/><circle cx="${w/2}" cy="${h/2}" r="${radius-9}"/></g><path class="axis" d="M${cx} ${pad*.45}V${h-pad*.45}M${pad*.45} ${cy}H${w-pad*.45}"/>${dots}<g>${edges}</g>${nodes}<g class="focus-sigil" style="transform-origin:${sx}px ${sy}px"><circle cx="${sx}" cy="${sy}" r="25"/><path d="M${sx-29} ${sy}h7 M${sx+22} ${sy}h7 M${sx} ${sy-29}v7 M${sx} ${sy+22}v7"/></g></svg>`;
}
function renderEarlyPath(){
 const board=data.builds[state.build][state.board],step=board.steps[state.step-1],sum=data.summaries[state.build];
 $('stageHead').innerHTML=`<h2>${esc(state.board)}</h2><span>${board.points} points in ${board.steps.length} clicks</span>`;
 $('stageBody').innerHTML=boardSVG(board);
 $('stageCaption').innerHTML=`<span>Center S is free. Numbers are the source click order.</span><span>${esc(labels[state.build])} · ${sum.points} points</span>`;
 let place=step.from?`${step.from} from start`:`Row ${step.row}, column ${step.col}`;
 $('inspector').className='inspector';
 $('inspector').innerHTML=`<span class="context">${esc(labels[state.build])} / ${esc(state.board)} / ${esc(classify(step.name))}</span><div class="step">${String(step.n).padStart(2,'0')}</div><h3 class="node-title">${esc(step.name)}</h3><p class="position">${esc(place)}</p><div class="spacer"></div><div class="meta-pair"><span>Click ${step.n} of ${board.steps.length}</span><strong>${step.cost?`${step.cost} points · ${step.points} spent`:`${board.points} on this board`}</strong></div><input class="progress" id="stepRange" aria-label="Choose click" type="range" min="1" max="${board.steps.length}" value="${step.n}"><div class="step-actions"><button data-step-change="-1" ${step.n===1?'disabled':''}>Previous click</button><button data-step-change="1" ${step.n===board.steps.length?'disabled':''}>Next click</button></div><p class="board-fact">${boardFact()}</p>`;
}
function parseMetrics(text){return text.replace(/^[^:]+:\s*/, '').replace(/\.$/,'').split(/,\s+(?![^()]*\))/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)(\s+(?:\+\d+(?:\.\d+)?%?|\d+)(?:\s*\(\+\d+\))?)$/);return m?[m[1],m[2].trim()]:[x,'']})}
function metricsMarkup(summary){let items=parseMetrics(summary[state.metricKind]),pageSize=state.build==='azphel'?4:5,pages=Math.ceil(items.length/pageSize);state.metricPage=Math.min(state.metricPage,pages-1);return `<div class="metric-head"><button data-metric="skills" aria-pressed="${active('metricKind','skills')}">Skill levels</button><button data-metric="stats" aria-pressed="${active('metricKind','stats')}">Stat totals</button></div><div class="metric-list">${items.slice(state.metricPage*pageSize,(state.metricPage+1)*pageSize).map(x=>`<div class="metric-row"><span title="${esc(x[0])}">${esc(x[0])}</span><span>${esc(x[1])}</span></div>`).join('')}</div><div class="pager"><button data-page="-1" ${state.metricPage===0?'disabled':''}>Previous</button><span>${state.metricPage+1} / ${pages}</span><button data-page="1" ${state.metricPage===pages-1?'disabled':''}>Next</button></div>`}
function renderLatePath(){
 const summary=data.late[state.build],names=Object.keys(summary.boards),selected=summary.boards[state.board];
 $('stageHead').innerHTML=`<h2>${state.build==='azphel'?'Azphel':esc(labels[state.build])}</h2><span>${summary.points} points allocated</span>`;
 const colors=['#bed9dc','#83a9b4','#537b8a','#365869'];
 let arcs='',cursor=0;const total=summary.points,circ=2*Math.PI*220;
 names.forEach((name,i)=>{const fraction=summary.boards[name]/total,dist=Math.max(0,(fraction-.009))*circ;arcs+=`<circle class="ring-segment ${name===state.board?'selected':''}" cx="300" cy="300" r="220" stroke="${colors[i]}" stroke-dasharray="${dist} ${circ-dist}" stroke-dashoffset="${-cursor*circ}"/>`;cursor+=fraction});
 if(names.length===1){let fraction=summary.points/232;arcs=`<circle class="ring-segment selected" cx="300" cy="300" r="220" stroke-dasharray="${fraction*circ} ${circ-fraction*circ}"/>`}
 $('stageBody').innerHTML=`<svg class="allocation" viewBox="0 0 600 600" role="img" aria-label="${summary.points} point allocation across ${names.join(', ')}"><circle class="ring-base" cx="300" cy="300" r="220"/>${arcs}<circle cx="300" cy="300" r="157" fill="none" stroke="#213943" stroke-width="1" stroke-dasharray="1 15"/><text class="total" x="300" y="315">${summary.points}</text><text class="total-label" x="300" y="347">${state.build==='azphel'?'of 232 board points':'Daevanion points'}</text></svg>`;
 $('stageCaption').innerHTML=`<span>Source gives allocation totals for this budget.</span><span>Value ${summary.value}</span>`;
 $('inspector').className='inspector late-inspector';
 $('inspector').innerHTML=`<span class="context">${esc(labels[state.build])} / allocation</span><div class="allocation-number">${selected}</div><h3 class="node-title">${esc(state.board)}</h3><p class="position">${(selected/summary.points*100).toFixed(1)}% of this budget</p><div class="allocation-list">${names.map(name=>`<button class="${name===state.board?'active':''}" data-board="${name}"><span>${name}</span><span>${summary.boards[name]}</span></button>`).join('')}</div>${metricsMarkup(summary)}<p class="board-fact">The source does not publish a click-by-click map for this budget.</p>`;
}
function coords(s){let r=8,c=8;for(const m of s.matchAll(/(\d+) (up|down|left|right)/g)){let n=Number(m[1]);if(m[2]==='up')r-=n;if(m[2]==='down')r+=n;if(m[2]==='left')c-=n;if(m[2]==='right')c+=n}return [r,c]}
function miniMap(name,position){const [r,c]=coords(position),x=110+(c-8)*13,y=103+(r-8)*13;return `<div class="atlas-board ${state.board===name?'current':''}"><strong>${name}</strong><svg viewBox="0 0 220 205" role="img" aria-label="${esc(name)}: ${esc(position)}"><path class="cross" d="M110 15v178M21 103h178"/><circle class="rings" cx="110" cy="103" r="69"/><circle class="rings" cx="110" cy="103" r="43"/><line class="direction" x1="110" y1="103" x2="${x}" y2="${y}"/><circle class="origin" cx="110" cy="103" r="4"/><circle class="target" cx="${x}" cy="${y}" r="7"/><text class="coordinate" x="110" y="196" text-anchor="middle">${esc(position)}</text></svg></div>`}
function renderAtlas(){const row=data.positions[state.skillIndex+1];$('stageHead').innerHTML=`<h2>Skill atlas</h2><span>${state.skillIndex+1} of ${data.positions.length-1}</span>`;$('stageBody').innerHTML=`<div class="atlas-grid">${boardNames.map((name,i)=>miniMap(name,row[i+2])).join('')}</div>`;$('stageCaption').innerHTML='<span>Positions count from the free center, including empty slots.</span><span>Top of map is up</span>';$('inspector').className='inspector';$('inspector').innerHTML=`<span class="context">${esc(row[1])} skill</span><div class="atlas-index">${String(state.skillIndex+1).padStart(2,'0')}</div><h3 class="atlas-detail">${esc(row[0])}</h3><div class="atlas-directions">${boardNames.map((name,i)=>`<span><b>${name}</b>${esc(row[i+2])}</span>`).join('')}</div><div class="spacer"></div><div class="step-actions"><button data-skill-change="-1" ${state.skillIndex===0?'disabled':''}>Previous skill</button><button data-skill-change="1" ${state.skillIndex===data.positions.length-2?'disabled':''}>Next skill</button></div><p class="board-fact">The four stat boards share their node geometry. Only the skills on skill nodes differ by class.</p>`}
function renderWeights(){const rows=data.weights[state.weightKind].slice(1),roleIndex={healer:1,damage:2,pvp:3}[state.build],pageSize=7,pages=Math.ceil(rows.length/pageSize);state.weightPage=Math.min(state.weightPage,pages-1);let slice=rows.slice(state.weightPage*pageSize,(state.weightPage+1)*pageSize),max=Math.max(...rows.map(r=>Number(r[roleIndex])));if(!slice.some((_,i)=>state.weightSelected===state.weightPage*pageSize+i))state.weightSelected=state.weightPage*pageSize;let selected=rows[state.weightSelected];$('stageHead').innerHTML=`<h2>${state.weightKind==='skills'?'Skill values':'Stat values'}</h2><span>${esc(labels[state.build])}</span>`;$('stageBody').innerHTML=`<div class="weights-chart">${slice.map((r,i)=>{let idx=state.weightPage*pageSize+i,val=Number(r[roleIndex]),pct=max?Math.max(1,val/max*100):0;return `<button class="weight-row ${idx===state.weightSelected?'selected':''}" data-weight="${idx}" aria-label="${esc(r[0])}: ${val} value points"><span class="weight-name">${esc(r[0])}</span><span class="weight-track"><i style="width:${pct}%"></i></span><span class="weight-value">${val}</span></button>`}).join('')}</div>`;$('stageCaption').innerHTML=`<span>${rows.length} source values. Zero means a connecting node only.</span><span>Value points, not measured output</span>`;$('inspector').className='inspector weights-inspector';$('inspector').innerHTML=`<span class="context">${esc(labels[state.build])} / ${state.weightKind==='skills'?'per skill level':'per typical node'}</span><div class="step">${esc(selected[roleIndex])}</div><h3 class="node-title">${esc(selected[0])}</h3><p class="position">Value points in the source's priority model</p><p class="weights-note">These values determine the node buy order. They are not measured healing or damage. The source says skill scaling beyond level 10 and the full healing formula are unpublished.</p><div class="spacer"></div><div class="pager"><button data-weight-page="-1" ${state.weightPage===0?'disabled':''}>Previous values</button><span>${state.weightPage+1} / ${pages}</span><button data-weight-page="1" ${state.weightPage===pages-1?'disabled':''}>Next values</button></div>`}
function render(){document.querySelectorAll('.view-button').forEach(b=>b.setAttribute('aria-pressed',state.view===b.dataset.view?'true':'false'));renderControls();if(state.view==='path'){if(state.budget==='early')renderEarlyPath();else renderLatePath()}else if(state.view==='atlas')renderAtlas();else renderWeights();$('keyHint').textContent=state.view==='path'&&state.budget==='early'?'Arrow keys move through clicks. Select any node to inspect it.':state.view==='atlas'?'Skill positions count from the free center.':'Browse every source weight by page.'}
document.addEventListener('click',e=>{const node=e.target.closest('[data-step]');if(node){state.step=Number(node.dataset.step);render();return}const b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.view){state.view=d.view;if(state.view==='weights'&&state.build==='azphel'){state.build='healer';state.board='Nezekan'}render()}else if(d.build){changeBuild(d.build)}else if(d.budget){setBudget(d.budget)}else if(d.board){selectBoard(d.board)}else if(d.stepChange){const board=data.builds[state.build][state.board];state.step=Math.max(1,Math.min(board.steps.length,state.step+Number(d.stepChange)));render()}else if(d.skillChange){state.skillIndex=Math.max(0,Math.min(data.positions.length-2,state.skillIndex+Number(d.skillChange)));render()}else if(d.weightKind){state.weightKind=d.weightKind;state.weightPage=0;state.weightSelected=0;render()}else if(d.weight){state.weightSelected=Number(d.weight);render()}else if(d.weightPage){state.weightPage+=Number(d.weightPage);state.weightSelected=state.weightPage*7;render()}else if(d.metric){state.metricKind=d.metric;state.metricPage=0;render()}else if(d.page){state.metricPage+=Number(d.page);render()}});
document.addEventListener('input',e=>{if(e.target.id==='stepRange'){state.step=Number(e.target.value);render()}else if(e.target.id==='skillSelect'){state.skillIndex=Number(e.target.value);render()}});
document.addEventListener('keydown',e=>{const b=e.target.closest('.node');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();state.step=Number(b.dataset.step);render();return}if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(state.view==='path'&&state.budget==='early'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){let len=data.builds[state.build][state.board].steps.length;state.step=e.key==='Home'?1:e.key==='End'?len:Math.max(1,Math.min(len,state.step+(e.key==='ArrowRight'?1:-1)));e.preventDefault();render()}});
$('motionToggle').addEventListener('click',()=>{state.motion=!state.motion;$('app').classList.toggle('motion-off',!state.motion);$('motionToggle').textContent=state.motion?'Pause motion':'Resume motion';$('motionToggle').setAttribute('aria-pressed',state.motion?'false':'true')});
render();
})();
</script>
</body></html>
