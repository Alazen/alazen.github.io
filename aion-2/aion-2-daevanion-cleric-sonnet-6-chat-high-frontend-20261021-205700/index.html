function routeViewBox(items,selected){if(window.innerWidth>720||state.mapFull)return '0 0 900 900';const stage=q('#boardStage');const h=stage?.getBoundingClientRect().height||290;const size=Math.max(350,Math.min(490,h*1.53));const target=xy(items[selected-1].p);const x=Math.max(0,Math.min(900-size,target[0]-size/2));const y=Math.max(0,Math.min(900-size,target[1]-size/2));return `${x.toFixed(1)} ${y.toFixed(1)} ${size.toFixed(1)} ${size.toFixed(1)}`;}
function mapSvg(items,selected){const purchased=items.map(x=>x.p);let edges='';let previous=[[8,8]];for(let i=0;i<items.length;i++){const node=items[i];const candidates=previous.filter(p=>Math.abs(p[0]-node.p[0])+Math.abs(p[1]-node.p[1])===1);let parent=candidates.at(-1);if(!parent){parent=previous.reduce((a,b)=>Math.abs(b[0]-node.p[0])+Math.abs(b[1]-node.p[1])<Math.abs(a[0]-node.p[0])+Math.abs(a[1]-node.p[1])?b:a)}const [x1,y1]=xy(parent),[x2,y2]=xy(node.p);const cls=i+1>selected?'future':i+1===selected?'recent':'';edges+=`<path class="route-link ${cls}" d="M${x1} ${y1}L${x2} ${y2}"/>`;previous.push(node.p)}let nodes='';items.forEach((node,i)=>{const num=i+1,[cx,cy]=xy(node.p),focus=num===selected,rad=node.kind==='corner'?19:17.5;const badge=node.kind==='passive'?`<rect class="node-ring" x="${cx-14}" y="${cy-14}" width="28" height="28" transform="rotate(45 ${cx} ${cy})" rx="2"/>`:node.kind==='corner'?`<rect class="node-ring" x="${cx-18}" y="${cy-18}" width="36" height="36" rx="2"/>`:`<circle class="node-ring" cx="${cx}" cy="${cy}" r="${rad}"/>`;nodes+=`<g class="node ${node.kind} ${num>selected?'future':''} ${focus?'focused':''}" role="button" tabindex="0" data-step="${num}" aria-label="Click ${num}: ${esc(node.name)}" >${focus?`<circle class="node-aura" cx="${cx}" cy="${cy}" r="23"/>`:''}${badge}<text class="node-number" x="${cx}" y="${cy}">${num}</text></g>`;});return `<svg role="img" aria-label="${esc(state.board)} click-order map with ${items.length} plotted nodes; select any node to inspect it" viewBox="${routeViewBox(items,selected)}" preserveAspectRatio="xMidYMid meet">${backdrop()}<g>${edges}</g>${drawStart()}<g>${nodes}</g></svg>`;}
function renderRoute(){const items=DATA.routes[state.profile][state.board];layout(state.board,`${items.length} clicks · ${summary().points[activeBoards().indexOf(state.board)]} points`);renderMap();renderDetails();q('#boardCaption').innerHTML='<span><i></i>Active</span><span><i class="passive"></i>Passive</span><span><i class="stat"></i>Stat</span><span><i class="corner"></i>Corner</span>'}

function renderDetails(){const el=q('#details');if(!el||state.view!=='routes')return;const items=DATA.routes[state.profile][state.board],item=items[state.step-1],s=summary(),spent=items.slice(0,state.step).reduce((a,x)=>a+(x.cost||0),0),pts=s.points[activeBoards().indexOf(state.board)],current=state.step;let location=item.from||[item.p[1]!==8?`${Math.abs(item.p[1]-8)} ${item.p[1]<8?'up':'down'}`:'',item.p[0]!==8?`${Math.abs(item.p[0]-8)} ${item.p[0]<8?'left':'right'}`:''].filter(Boolean).join(' · ');const statSize=pageSizeStats();const totalStatPages=Math.ceil(s.stats.length/statSize);state.routeStatPage=Math.min(state.routeStatPage,totalStatPages-1);let statHTML=s.stats.slice(state.routeStatPage*statSize,(state.routeStatPage+1)*statSize).map(st=>{let [name,val]=statLabel(st);return `<div class="impact-stat"><span title="${esc(name)}">${esc(name)}</span><b>${esc(val)}</b></div>`}).join('');const progress=state.profile==='azphel'?`${current} of ${items.length} clicks`: `${spent} of ${pts} points`;const cost=state.profile==='azphel'?'Node costs not itemized in source':`${item.cost} ${item.cost===1?'point':'points'} for this node`;el.innerHTML=`<div class="stepheader"><div class="step-count">${String(current).padStart(2,'0')}</div><div class="step-context"><strong>${esc(state.board)}</strong><span>Click ${current} / ${items.length}</span></div></div><h3 class="step-name"><small style="color:${asColor(item.kind)}">${item.kind==='active'?'Active skill':item.kind==='passive'?'Passive skill':item.kind==='corner'?'Corner bonus':'Stat node'}</small>${esc(item.name)}</h3><p class="step-sub">${esc(cost)}. Position: ${esc(location||'At the center')}.</p><div class="step-progress"><b>${progress}</b><span>${Math.round(current/items.length*100)}% of click sequence</span></div><div class="progress-track"><div class="progress-fill" style="width:${(current/items.length*100).toFixed(2)}%"></div></div><div class="actions"><div class="action-steps"><button class="circle-action" data-act  q('#details').innerHTML=`<h3 class="summary-heading">${state.profile==='azphel'?'Defensive reach':leading+' skills at level 14'}</h3><p class="summary-description">${esc(extra)}</p><div class="summary-switch"><button data-sumpane="stats" class="${!isSkills?'active':''}">Bonuses (${s.stats.length})</button>${s.skills.length?`<button data-sumpane="skills" class="${isSkills?'active':''}">Skill levels (${s.skills.length})</button>`:''}</div><div class="impact-head">${isSkills?'Final skill levels':'Final '+state.budget+'-point bonuses'} ${bonusPager(state.summaryPage,count,'summary-page')}</div>${listHtml}<p class="summary-note">${state.profile==='azphel'?'Azphel uses a separate crystal pool.':'Select 149 points to inspect exact node-by-node routes.'}</p>`;
}
function renderAtlas(){const current=DATA.positions[state.atlasIndex],positions=current.boards[state.board]||[];layout(state.board,`Unlock ${DATA.boardInfo.find(x=>x.name===state.board).unlock} · ${DATA.boardInfo.find(x=>x.name===state.board).fill} to fill`);let marks=positions.map((p,i)=>{const [x,y]=xy(p.xy);return `<g><circle class="atlas-crosshair" cx="${x}" cy="${y}" r="34"/><path class="atlas-crosshair" d="M${x-47} ${y}h15m64 0h15M${x} ${y-47}v15m0 64v15"/><circle cx="${x}" cy="${y}" r="20" class="atlas-locator active"/><text x="${x}" y="${y}" class="atlas-locator-label">${i+1}</text></g>`}).join('');q('#boardStage').innerHTML=`<svg viewBox="0 0 900 900" role="img" aria-label="Locations of ${esc(current.name)} on ${esc(state.board)}">${backdrop()}${drawStart()}${marks}</svg>`;q('#boardCaption').textContent=positions.length?`${positions.length} location${positions.length===1?'':'s'} on this board`:'No nodes for this skill on this board';let local=BOARDS.map(b=>({name:b,loc:current.boards[b]}));q('#details').classList.add('atlas-sidebar');q('#details').innerHTML=`<div class="stepheader"><div class="step-count" style="font-size:65px">${String(state.atlasIndex+1).padStart(2,'0')}</div><div class="step-context"><strong>${current.kind==='active'?'Active skill':'Passive skill'}</strong><span>Skill ${state.atlasIndex+1} of ${DATA.positions.length}</span></div></div><h3 class="step-name">${esc(current.name)}</h3><div class="actions"><div class="action-steps"><button class="circle-action" data-action="prev-skill" aria-label="Previous skill">${btnIcon('left')}</button><button class="circle-action" data-action="next-skill" aria-label="Next skill">${btnIcon('right')}</button></div><span style="font-size:11px;color:var(--muted)">4 nodes across the boards</span></div><div class="impact-head">Locations relative to the center</div><div class="atlas-matrix">${local.map(x=>`<div class="atlas-location ${x.name===state.board?'active':''}"><strong>${x.name}</strong><p>${x.loc.length?x.loc.map(v=>esc(v.relative)).join(' / '):'No nodes'}</p></div>`).join('')}</div><p class="atlas-description">These locations are the published skill-node table, plotted on a 15 × 15 coordinate lattice. Each skill grants up to four levels across the boards.</p>`}
function renderWeights(){layout('Priority weights',`Source weights · ${TYPES[state.profile].label}`);const arr=DATA.weights[state.weightKind].slice().sort((a,b)=>b[state.profile==='azphel'?'pvp':state.profile]-a[state.profile==='azphel'?'pvp':state.profile]||a.name.localeCompare(b.name));const len=6,total=Math.ceil(arr.length/len);state.weightPage=Math.min(state.weightPage,total-1);const part=arr.slice(state.weightPage*len,state.weightPage*len+len),max=Math.max(1,...arr.flatMap(x=>[x.healer,x.damage,x.pvp]));q('#boardStage').innerHTML=`<div style="width:100%;height:100%;display:flex;flex-direction:column;min-height:0"><div class="weight-head"><div class="mode-switch"><button class="${state.weightKind==='skill'?'active':''}" data-weightkind="skill">Skills</button><button class="${state.weightKind==='stat'?'active':''}" data-weightkind="stat">Stats & corners</button></div></div><div class="weight-list">${part.map(item=>`<div class="weightrow"><span class="wname" title="${esc(item.name)}">${esc(item.name)}</span><div class="weight-channels">${['healer','damage','pvp'].map(profile=>`<div class="weight-channel ${(state.profile===profile||(state.profile==='azphel'&&profile==='pvp'))?'strong':''}" style="--bar-color:${TYPES[profile].color}" title="${TYPES[profile].label}: ${item[profile]}"><span class="wbar"><i style="width:${(item[profile]/max*100).toFixed(2)}%"></i></span><span class="wscore">${fmt(item[profile])}</span></div>`).join('')}</div></div>`).join('')}</div><div class="weight-pager"><span>${state.weightPage*len+1}–${Math.min(arr.length,(state.weightPage+1)*len)} of ${arr.length}</span><div class="pagination"><button data-action="weight-prev" ${state.weightPage===0?'disabled':''} aria-label="Previous weight page">${btnIcon('left')}</button><span>${state.weightPage+1} / ${total}</span><button data-action="weight-next" ${state.weightPage===total-1?'disabled':''} aria-label="Next weight page">${btnIcon('right')}</button></div></div><div class="weight-legend"><span><i class="h"></i>Healer</span><span><i class="d"></i>Damage</span><span><i class="p"></i>PvP</span></div></div>`;q('#boardCaption').innerHTML='';const profile=state.profile==='azphel'?'pvp':state.profile,top=arr.slice(0,4);q('#details').innerHTML=`<h3 class="weight-info">What matters most<br>to ${esc(TYPES[state.profile].label)}</h3><p class="weight-clause">Weights establish a priority order. They are not measured healing or damage output. Larger values are favored when the source's optimizer allocates crystals.</p><div class="weight-best"><h3>Highest ${state.weightKind==='skill'?'skill':'stat'} priorities</h3>${top.map(x=>`<p><span>${esc(x.name)}</span><b>${fmt(x[profile])}</b></p>`).join('')}</div><p class="reading-note">Values are taken directly from Aion 2 Companion's published weighted optimization tables. Select Skills or Stats to see every row across four pages.</p>`}
root.addEventListener('click',ev=>{const profile=ev.target.closest('[data-profile]');if(profile)return selectProfile(profile.dataset.profile);const budget=ev.target.closest('[data-budget]');if(budget)return selectBudget(budget.dataset.budget);const board=ev.target.closest('[data-board]');if(board)return selectBoard(board.dataset.board);const view=ev.target.closest('[data-view]');if(view)return setView(view.dataset.view);const step=ev.target.closest('[data-step]');if(step)return selectStep(Number(step.dataset.step));const pane=ev.target.closest('[data-sumpane]');if(pane){state.summaryPane=pane.dataset.sumpane;state.summaryPage=0;return renderSummary()}const w=ev.target.closest('[data-weightkind]');if(w){state.weightKind=w.dataset.weightkind;state.weightPage=0;return renderWeights()}const action=ev.target.closest('[data-action]');if(action){switch(action.dataset.action){case 'prev-step':selectStep(state.step-1);break;case 'next-step':selectStep(state.step+1);break;case 'play':togglePlay();break;case 'map-zoom':state.mapFull=!state.mapFull;renderMap();break;case 'prev-skill':state.atlasIndex=(state.atlasIndex-1+DATA.positions.length)%DATA.positions.length;renderAtlas();break;case 'next-skill':state.atlasIndex=(state.atlasIndex+1)%DATA.positions.length;renderAtlas();break;case 'route-bonus-prev':state.routeStatPage=Math.max(0,state.routeStatPage-1);renderDetails();break;case 'route-bonus-next':state.routeStatPage++;renderDetails();break;case 'summary-page-prev':state.summaryPage=Math.max(0,state.summaryPage-1);renderSummary();break;case 'summary-page-next':state.summaryPage++;renderSummary();break;case 'weight-prev':state.weightPage--;renderWeights();break;case 'weight-next':state.weightPage++;renderWeights();break}}});
root.addEventListener('keydown',ev=>{const step=ev.target.closest('[data-step]');if(step&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();selectStep(Number(step.dataset.step))}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){stopPlay();renderDetails()}if(ev.target.closest('button, input, a, [data-step]'))return;if(state.view==='routes'&&['ArrowRight','ArrowLeft'].includes(ev.key)&&!((state.profile==='azphel'&&state.budget==='100')||(state.budget==='316'))){ev.preventDefault();selectStep(state.step+(ev.key==='ArrowRight'?1:-1));}});
q('#motionToggle').addEventListener('click',()=>{state.motionOff=!state.motionOff;root.classList.toggle('no-motion',state.motionOff);q('#motionToggle').textContent=state.motionOff?'Resume motion':'Pause motion';q('#motionToggle').setAttribute('aria-pressed',String(state.motionOff));if(state.motionOff&&state.playing){stopPlay();renderDetails()}});
window.addEventListener('resize',()=>render());
render();
</script>
</body>
</html>
