:root{--ink:#f1eee6;--muted:#9b9b92;--amber:#e9c183;--sage:#b6d5ba;--faint:#292c29;--row:44px;color-scheme:dark;font-family:AtlasSans,sans-serif;font-size:15px;background:#000;color:var(--ink)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{height:100dvh}button,select{font:inherit}button,a,select{-webkit-tap-highlight-color:transparent}button{color:inherit;cursor:pointer}button:disabled{opacity:.25;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible,[role=button]:focus-visible{outline:2px solid var(--amber);outline-offset:4px}button{background:none;border:0}a{color:inherit;text-underline-offset:4px}a:hover{color:var(--amber)}
.app{height:100%;max-width:1760px;margin:auto;padding:30px 48px 18px;display:flex;flex-direction:column;gap:20px;min-height:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:30px;flex:none}h1{font:400 31px/1.1 AtlasSerif,Georgia,serif;margin:0;white-space:nowrap}h1 span{color:var(--amber);font-style:italic;margin-left:7px}.picker{position:relative;width:min(450px,48%)}.picker svg{position:absolute;right:14px;top:20px;pointer-events:none}select{appearance:none;width:100%;padding:13px 40px 13px 16px;border:1px solid #4a4b43;border-radius:0;background:#000;color:var(--ink);min-height:48px;cursor:pointer}select:hover{border-color:var(--amber)}option,optgroup{background:#10110f;color:var(--ink)}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex:none;padding-top:9px}h2{font:400 clamp(38px,4vw,62px)/1.08 AtlasSerif,Georgia,serif;margin:0;letter-spacing:-1.7px}.context{margin:8px 0 0;color:var(--muted);font-size:14px}.tally{display:flex;align-items:baseline;gap:24px;white-space:nowrap}.tally strong{font:400 39px/1 AtlasSerif,serif;color:var(--amber);margin-right:6px}.tally span{color:var(--muted);font-size:13px}
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(450px,.96fr);gap:50px}.diagram{display:flex;flex-direction:column;min-width:0;min-height:0}.map-wrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}.map{width:100%;height:100%;max-width:700px;overflow:visible}.base-edge{stroke:#171b18;stroke-width:1.3}.owned-edge{stroke:#65694e;stroke-width:2}.empty-node{fill:#353933}.axis{fill:#73786e;font:12px AtlasSans,sans-serif;text-anchor:middle}.node{cursor:pointer;outline:none}.node .shape{fill:#121714;stroke:#6f8270;stroke-width:1.4;transition:fill .15s,stroke .15s}.node.stat .shape{stroke:#777c6b;fill:#141713}.node.active .shape{fill:#30271b;stroke:var(--amber)}.node.passive .shape{fill:#17271c;stroke:var(--sage)}.node.corner .shape{fill:#e9c183;stroke:#e9c183}.node text{fill:#f0ece3;font:12px AtlasSans,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}.node.corner text{fill:#000}.node.off-page{opacity:.43}.node:hover,.node:focus-visible{opacity:1}.node:focus-visible .shape{stroke:#fff;stroke-width:3}.selection-ring{fill:none;stroke:#fff;stroke-width:1.2}.start-shape{fill:#070a07;stroke:#75836c;stroke-width:1.3}.start-text{fill:var(--sage);font:12px AtlasSans,sans-serif;text-anchor:middle;dominant-baseline:central}
.detail{min-height:55px;display:flex;align-items:center;gap:14px;padding:6px 8px 0}.detail-number{font:32px AtlasSerif,serif;color:var(--amber);min-width:38px}.detail-name{font-size:16px;line-height:1.25}.detail-location{color:var(--muted);font-size:12px;margin-top:4px}.legend{display:flex;justify-content:center;gap:22px;font-size:12px;color:var(--muted);padding:12px 0 2px;flex:none}.legend span{display:flex;align-items:center;gap:7px}.key{width:6px;height:6px;border:1px solid currentColor;display:inline-block;transform:rotate(45deg)}.key.stat{color:#d8d8c4;transform:none;border-radius:50%}.key.active{color:var(--amber)}.key.passive{color:var(--sage)}
.table-area{min-height:0;min-width:0;display:flex;flex-direction:column}.table-top{display:flex;justify-content:space-between;align-items:center;min-height:36px;gap:12px;color:var(--muted);font-size:12px}.table-top p{margin:0}.table-top span{white-space:nowrap}.table-window{flex:1;min-height:0;overflow:hidden}table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}caption{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}thead{height:34px}th{text-align:left;color:#a8ac9e;font-size:11px;font-weight:400;padding:0 8px 8px}td{height:var(--row);padding:6px 8px;vertical-align:middle;overflow-wrap:anywhere}th:first-child,td:first-child{padding-left:0}th:last-child,td:last-child{padding-right:0}tbody tr{transition:background .15s}tbody tr.selected{background:#131912}tbody tr[data-node]:hover{background:#10140f}.step{color:#8e9484;font-variant-numeric:tabular-nums}.node-name{padding:0;text-align:left;font-size:14px;line-height:1.2;width:100%}.node-name .bonus{color:var(--muted);white-space:nowrap}.node-name.active{color:var(--amber)}.node-name.passive{color:var(--sage)}.node-name.corner{color:var(--amber)}.cost,.cumulative{text-align:right;font-variant-numeric:tabular-nums}.cost{color:#a9ac9f}.cumulative{color:var(--amber)}.direction{color:#a7ac9f;font-size:12px;line-height:1.25}.inline-location{display:none}.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;height:48px;flex:none;color:var(--muted);font-size:12px}.pager-buttons{display:flex;gap:12px}.pager button{min-width:40px;min-height:40px;font-size:21px}.pager button:not(:disabled):hover{color:var(--amber)}.pager-index{font-variant-numeric:tabular-nums}

 $('view-title').textContent=current.title;
 $('context').textContent=b?current.group:summary?`${current.budget}-point allocation summary`:'Cleric boards · source reference';
 $('tally').innerHTML=b?`<div><strong>${current.total}</strong><span>points</span></div><div><strong>${current.rows.length}</strong><span>nodes</span></div>`:summary?`<div><strong>${current.budget}</strong><span>points</span></div>`:`<div><strong>${current.rows.length}</strong><span>entries</span></div>`;
 $('table-title').textContent=b?'Purchase order':summary?'Allocation, skills & stats':current.title==='Skill positions'?'Distances from the center':current.title.includes('priorities')?'Priority weights':'Board properties';
 $('caption').textContent=`${current.group}, ${current.title}`;
 $('note').textContent=current.note;
 $('diagram').hidden=!b&&!summary;
 $('legend').style.display=b?'':'none';$('detail').style.display=b?'':'none';
 const headers=b?(current.title==='Azphel'?['#','Node','From start']:['#','Node','Cost','Spent','From start']):current.headers;
 $('thead').innerHTML='<tr>'+headers.map((h,i)=>`<th scope="col" class="${b&&(i===2||i===3)&&headers.length===5?(i===2?'cost':'cumulative'):''} ${b&&i===headers.length-1?'direction-col':''}">${esc(h)}</th>`).join('')+'</tr>';
 const mobile=matchMedia('(max-width:760px)').matches;
 let widths=b?(current.title==='Azphel'?(mobile?[10,90,0]:[7,61,32]):(mobile?[9,67,11,13,0]:[7,48,8,10,27])):summary?[20,54,26]:current.headers.length===4?[49,17,17,17]:current.headers.length===6?[23,10,17,17,17,16]:[];
 $('columns').innerHTML=widths.map((w,i)=>`<col style="width:${w}%" class="${b&&i===widths.length-1?'direction-col':''}">`).join('');
 if(summary){$('map-wrap').innerHTML=`<div class="summary-graphic"><p class="allocation-title">${current.budget} points,<br>allocated.</p>${current.allocation.map(([name,n])=>`<div class="allocation-row"><span>${esc(name)}</span><div class="allocation-track"><div class="allocation-bar" style="width:${n/current.budget*100}%"></div></div><b>${n}</b></div>`).join('')}<p class="summary-note">${esc(current.note)}</p></div>`;}
}
function rowHTML(r,index){
 if(current.type==='board'){
  const az=current.title==='Azphel';
  return `<tr data-node="${r.n}" class="${r.n===selected?'selected':''}"><td class="step">${String(r.n).padStart(2,'0')}</td><td><button class="node-name ${r.kind}" data-select="${r.n}" aria-label="Select step ${r.n}: ${esc(r.name)}" ${r.n===selected?'aria-current="step"':''}>${bonusName(r.name)}</button><span class="inline-location">${formatLocation(r.loc)}</span></td>${az?'':`<td class="cost">${r.cost}</td><td class="cumulative">${r.points}</td>`}<td class="direction direction-col">${formatLocation(r.loc)}</td></tr>`;
 }
 const weights=current.title.includes('priorities');
 return '<tr>'+r.map((cell,i)=>`<td data-label="${esc(current.headers[i])}" class="${weights&&i?'weight-cell':''}" ${weights&&i?`style="--weight:${Number(cell)/14*82}%"`:''}>${esc(cell)}</td>`).join('')+'</tr>';
}
function paginate(){
 const keepIndex=pages[page]?.start||0;pages=[];
 const area=$('table-window'),body=$('tbody');
 // Measure every row at the real column widths. No row or table is scrolled or clipped.
 body.innerHTML=current.rows.map(rowHTML).join('');
 const heights=[...body.rows].map(r=>Math.ceil(r.getBoundingClientRect().height));
 const usable=Math.floor(area.getBoundingClientRect().height-$('thead').getBoundingClientRect().height)-2;
 let start=0,used=0;
 for(let i=0;i<heights.length;i++){
  if(i>start&&used+heights[i]>usable){pages.push({start,end:i});start=i;used=0;}
  used+=heights[i];
 }
 pages.push({start,end:heights.length});
 page=Math.max(0,pages.findIndex(p=>keepIndex>=p.start&&keepIndex<p.end));
 renderPage();
}
function renderPage(){
 const range=pages[page];if(!range)return;
 $('tbody').innerHTML=current.rows.slice(range.start,range.end).map(rowHTML).join('');
 $('row-range').textContent=`${String(range.start+1).padStart(2,'0')}–${String(range.end).padStart(2,'0')} of ${current.rows.length}`;
 $('page-status').textContent=current.type==='board'?'Select a node to inspect it':'Every source entry is preserved';
 $('page-index').textContent=`${page+1} / ${pages.length}`;
 $('prev').disabled=page===0;$('next').disabled=page===pages.length-1;
 if(current.type==='board')renderMap();
}
function renderMap(){
 const rows=current.rows,grid=current.grid;const min=Math.min(...grid.map(c=>c.x)),max=Math.max(...grid.map(c=>c.x));
 const step=520/(max-min),px=x=>60+(x-min)*step,py=y=>60+(y-min)*step;
 const range=pages[page],selectedRow=rows[selected-1];
 const owned=new Map(rows.map(r=>[`${r.x},${r.y}`,r]));owned.set('8,8',{n:0});
 const all=new Set(grid.map(c=>`${c.x},${c.y}`));let edges='',axis='',nodes='';
 for(const c of grid){
  for(const [dx,dy]of[[1,0],[0,1]]){
   const k=`${c.x+dx},${c.y+dy}`;
   if(all.has(k))edges+=`<line class="${owned.has(`${c.x},${c.y}`)&&owned.has(k)?'owned-edge':'base-edge'}" x1="${px(c.x)}" y1="${py(c.y)}" x2="${px(c.x+dx)}" y2="${py(c.y+dy)}"/>`;
  }
  if(c.v==='.')nodes+=`<circle class="empty-node" cx="${px(c.x)}" cy="${py(c.y)}" r="2.3"/>`;
 }
 for(let i=min;i<=max;i++)axis+=`<text class="axis" x="${px(i)}" y="24">${i}</text><text class="axis" x="22" y="${py(i)+4}">${i}</text>`;
 const radius=step<40?12:14;
 for(const r of rows){
  const isSelected=r.n===selected,onPage=r.n>range.start&&r.n<=range.end;
  const shape=r.kind==='active'||r.kind==='corner'?`<rect class="shape" x="${-radius*.78}" y="${-radius*.78}" width="${radius*1.56}" height="${radius*1.56}" transform="rotate(45)"/>`:`<circle class="shape" r="${r.kind==='stat'?radius*.9:radius}"/>`;
  nodes+=`<g class="node ${r.kind} ${onPage?'':'off-page'}" transform="translate(${px(r.x)},${py(r.y)})" role="button" tabindex="${isSelected?'0':'-1'}" data-select="${r.n}" aria-label="Step ${r.n}, ${esc(r.name)}, ${esc(r.loc)}" ${isSelected?'aria-pressed="true"':'aria-pressed="false"'}>${isSelected?`<circle class="selection-ring" r="${radius+6}"/>`:''}${shape}<text>${r.n}</text></g>`;
 }
 $('map-wrap').innerHTML=`<svg class="map" viewBox="0 0 640 620" role="group" aria-label="${esc(current.title)} numbered board map. Use arrow keys to move between numbered nodes."><title>${esc(current.title)} · ${esc(current.group)}</title>${edges}${axis}<g transform="translate(${px(8)},${py(8)})"><path class="start-shape" d="M0 -17 17 0 0 17 -17 0Z"/><text class="start-text">S</text></g>${nodes}</svg>`;
 $('detail').innerHTML=`<span class="detail-number">${String(selected).padStart(2,'0')}</span><div><div class="detail-name">${esc(selectedRow.name)}</div><div class="detail-location">${esc(selectedRow.loc)}${selectedRow.cost?` · Cost ${selectedRow.cost} · ${selectedRow.points} points spent`:''}</div></div>`;
}
function chooseNode(n,focus=false){
 selected=Math.max(1,Math.min(current.rows.length,n));page=pages.findIndex(p=>selected-1>=p.start&&selected-1<p.end);renderPage();
 if(focus)$('map-wrap').querySelector(`[data-select="${selected}"]`)?.focus();
}
function turnPage(delta){if(page+delta<0||page+delta>=pages.length)return;page+=delta;if(current.type==='board')selected=pages[page].start+1;renderPage();}
function choose(id){current=views.find(v=>v.id===id)||views[0];selected=1;page=0;pages=[];$('build').value=current.id;configure();paginate();}
document.addEventListener('click',e=>{const node=e.target.closest('[data-select]')||e.target.closest('tr[data-node]');if(node&&current.type==='board'){const fromButton=node.tagName==='BUTTON';const n=Number(node.dataset.select||node.dataset.node);chooseNode(n);if(fromButton)$('tbody').querySelector(`[data-select="${n}"]`)?.focus();}});
$('map-wrap').addEventListener('keydown',e=>{const node=e.target.closest('[data-select]');if(!node||current.type!=='board')return;let n=Number(node.dataset.select);if(['Enter',' '].includes(e.key)){e.preventDefault();chooseNode(n,true);}else if(['ArrowLeft','ArrowUp','ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();e.stopPropagation();chooseNode(n+(['ArrowLeft','ArrowUp'].includes(e.key)?-1:1),true);}});
$('build').addEventListener('change',e=>choose(e.target.value));$('prev').addEventListener('click',()=>turnPage(-1));$('next').addEventListener('click',()=>turnPage(1));
document.addEventListener('keydown',e=>{if(e.target.closest?.('select,input,textarea'))return;if(['PageDown','PageUp'].includes(e.key)){e.preventDefault();turnPage(e.key==='PageDown'?1:-1);}});
window.addEventListener('resize',()=>{if(resizing)return;resizing=true;requestAnimationFrame(()=>{configure();paginate();resizing=false;});});
choose(location.hash.slice(1));
document.fonts.ready.then(()=>{configure();paginate();});
})();
</script>
