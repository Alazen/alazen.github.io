<!--
DESIGN PLAN & SELF-REVIEW
Subject: AION 2 Cleric Daevanion builds. Audience: players following exact purchases.
Primary job: replace dense build tables with accurate coordinates, steps and a board-first interactive visual.
Palette: Abyss #000000, Porcelain #efeadc, Antique gold #d2ae73, Sacred teal #a6dcd2, Violet #b9a9e4, Ash #777778.
Type: Cormorant Garamond (ritual/character), Manrope (functional labels and legibility).
Layout A [rejected]: sidebar | uniform tile cards | detail stack. Too close to SaaS dashboards.
Layout B [chosen]: build text | single celestial plotting field | live purchase readout. Flush baseline, left-aligned functional copy; centered grid cartography.
  [mark / navigation]
  [build and boards] [    celestial node field    ] [selected step / six-step rail]
  [                 step navigation + source                 ]
Visual principle: the board is an illuminated navigational instrument, not a form or spreadsheet.
Motion: one slowly rotating astral ring, plus a single board reveal. Manual motion pause. No section slide-ups.
Review: dropped gradient hero, pills, stacked cards, and faux skill illustrations. Kept black space and indexed node geometry grounded in the source.
Data caveat: the source publishes exact 149-point numbered routes, a 40-point Azphel route and summary totals at 100/316, but not equivalent detailed routes for 100/316. This page intentionally does not synthesize them.
-->

function setAzphelBudget(n){state.azphelBudget=n;state.step=1;state.page=0;state.mapDetailView='route';render(true);}
function setMapDetailView(v){state.mapDetailView=v;state.page=v==='route'?Math.floor((state.step-1)/pageSize()):0;render(false);}
function render(newBoard=false){
 document.querySelectorAll('.tab').forEach(e=>{const on=e.dataset.mode===state.mode;e.setAttribute('aria-selected',on?'true':'false');e.tabIndex=on?0:-1;});$('mobileMode').value=state.mode;
 const boardSelect=$('mobileBoard');let opts='';
 if(state.mode==='full')opts=`<option value="heal">Healer</option><option value="damage">Damage</option><option value="pvp">PvP</option>`;
 else if(state.mode==='weights')opts=`<option value="skills">Skill weights</option><option value="stats">Stat weights</option>`;
 else if(state.mode==='azphel')opts=`<option value="40">40 points</option><option value="100">100 points</option>`;
 else opts=BOARD_ORDER.map(s=>`<option value="${s}">${s}</option>`).join('');
 boardSelect.innerHTML=opts;boardSelect.value=state.mode==='full'?state.fullMode:state.mode==='weights'?state.weightCategory:state.mode==='azphel'?String(state.azphelBudget):state.board;
 const svg=$('chartSvg');svg.innerHTML='';if(newBoard){svg.classList.remove('reveal');void svg.getBoundingClientRect();svg.classList.add('reveal');}
 if(isMap())renderMap();else if(state.mode==='full'||state.mode==='azphel')renderSummary();else renderWeights();
 $('stepbar').classList.toggle('hidden',!isMap());$('bottomNote').textContent=isMap()?'Choose a node to inspect':(state.mode==='weights'?'Weights are priorities, not measured output':'Full allocations only; no inferred click route');
}
function renderLeft(content){$('left').innerHTML=content;}
function renderMap(){
 const b=build(),meta=DATA.meta[state.board],nodes=path(),max=nodes.length;
 state.step=Math.max(1,Math.min(state.step,max));if(state.mapDetailView==='route')state.page=Math.floor((state.step-1)/pageSize());
 $('fieldTitle').textContent=state.board;$('fieldSubtitle').textContent=`Unlock at level ${meta.level} · ${meta.corners}`;
 $('fieldNumber').textContent=b.boards[state.board].points;$('fieldNumberLabel').textContent='points allocated';
 const modeLabel=b.name;
 renderLeft(`<h1 class="the-name"><span>${esc(modeLabel.split(' ')[0])}</span><span>${esc(modeLabel.split(' ').slice(1).join(' '))}</span></h1><p class="subline">${esc(b.summary)}<br>${b.points} total points across ${state.mode==='azphel'?'one board':'four boards'}.</p><div class="board-nav" aria-label="Choose board">${state.mode==='azphel'?`<button class="board-button selected" data-budget="40"><span class="bn">40 points / route</span><span class="bc">Map</span></button><button class="board-button" data-budget="100"><span class="bn">100 points / totals</span><span class="bc">Summary</span></button>`:BOARD_ORDER.map(s=>`<button class="board-button ${state.board===s?'selected':''}" data-board="${s}"><span class="bn">${s}</span><span class="bc">${b.boards[s].points} pt</span></button>`).join('')}</div><div class="left-tail"><span>Build value</span><strong>${b.value.toFixed(1)}</strong><small>priority points</small></div>`);
 document.querySelectorAll('[data-board]').forEach(el=>el.addEventListener('click',()=>selectBoard(el.dataset.board)));document.querySelectorAll('[data-budget]').forEach(el=>el.addEventListener('click',()=>setAzphelBudget(+el.dataset.budget)));
 $('stageMeta').innerHTML='<span class="legend-key"><i class="key-shape active"></i>Active skill</span><span class="legend-key"><i class="key-shape passive"></i>Passive</span><span class="legend-key"><i class="key-shape"></i>Stat</span><span class="legend-key"><i class="key-shape corner"></i>Corner</span>';
 renderNodeMap(nodes);renderMapDetails(nodes);
 const scrub=$('scrub');scrub.max=max;scrub.value=state.step;scrub.style.setProperty('--fill',`${(state.step-1)/(max-1)*100}%`);$('prevStep').disabled=state.step<=1;$('nextStep').disabled=state.step>=max;
}
function renderNodeMap(nodes){
 const svg=$('chartSvg');svg.setAttribute('viewBox','-366 -316 732 632');svg.setAttribute('aria-label',`${state.board}, ${build().name}: ${nodes.length} purchases on a coordinate grid`);
 const base=svgEl('g',{},svg);const bg=svgEl('g',{},base);
 for(let r=44;r<=286;r+=48){svgEl('circle',{cx:0,cy:0,r,fill:'none',stroke:'#d9be91','stroke-opacity':r===188?'.12':'.065','stroke-width':'.7'},bg)}
 for(let i=0;i<12;i++){const a=i*Math.PI/6;svgEl('path',{d:`M ${Math.cos(a)*267} ${Math.sin(a)*267} L ${Math.cos(a)*275} ${Math.sin(a)*275}`,stroke:'#a78d64','stroke-opacity':'.3','stroke-width':'1'},bg)}
 for(let y=-7;y<=7;y++)for(let x=-7;x<=7;x++)svgEl('circle',{cx:x*40,cy:y*40,r:1.05,fill:'#baa989','fill-opacity':x===0&&y===0?0:.17},bg);
 svgEl('path',{d:'M-306 0H306 M0 -306V306',stroke:'#bfaa83','stroke-opacity':'.09','stroke-width':'.8'},bg);
 const start=svgEl('g',{},svg);svgEl('circle',{cx:0,cy:0,r:22,fill:'#0d1210',stroke:'#b1d5cb','stroke-width':'1.2'},start);svgEl('circle',{cx:0,cy:0,r:27,fill:'none',stroke:'#a6dcd2','stroke-opacity':'.18'},start);svgEl('path',{d:'M0 -12 3 -3 12 0 3 3 0 12 -3 3 -12 0 -3 -3Z',fill:'#c9e5d7'},start);
 // Order represents purchase order, not a spatially continuous path. Each link is to an already-owned adjacent node.
 const lines=svgEl('g',{},svg);const owned=new Map([['0,0',{x:0,y:0,order:0}]]);
 nodes.forEach(n=>{const choices=[{x:n.x+1,y:n.y},{x:n.x-1,y:n.y},{x:n.x,y:n.y+1},{x:n.x,y:n.y-1}].map(p=>owned.get(`${p.x},${p.y}`)).filter(Boolean);const parent=choices.sort((a,b)=>b.order-a.order)[0];if(parent){const active=n.order<=state.step;svgEl('line',{x1:parent.x*40,y1:parent.y*40,x2:n.x*40,y2:n.y*40,stroke:active?'#9fbeb5':'#685b4e','stroke-opacity':active?'.84':'.39','stroke-width':active?'1.7':'1.1','stroke-linecap':'round',class:'path-line'},lines)}owned.set(`${n.x},${n.y}`,n);});
 const dots=svgEl('g',{},svg);
 nodes.forEach(n=>{const k=kind(n),color=nodeColor(k),sel=n.order===state.step,visited=n.order<=state.step,x=n.x*40,y=n.y*40;
 const g=svgEl('g',{'class':'svg-node',role:'button',tabindex:0,'aria-label':`Step ${n.order}: ${n.name}`,'aria-pressed':sel?'true':'false'},dots);
 g.addEventListener('click',()=>selectStep(n.order));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectStep(n.order)}});
 if(sel){svgEl('circle',{cx:x,cy:y,r:23,fill:'none',stroke:color,'stroke-width':'.9','stroke-opacity':'.65'},g);svgEl('circle',{cx:x,cy:y,r:28,fill:'none',stroke:color,'stroke-width':'.7','stroke-opacity':'.2'},g)}
 const r=k==='stat'?13:k==='corner'?18:16;let shape;
 if(k==='active')shape=svgEl('path',{d:`M${x-r} ${y-r*.56} L${x} ${y-r*1.1} L${x+r} ${y-r*.56} L${x+r} ${y+r*.56} L${x} ${y+r*1.1} L${x-r} ${y+r*.56} Z`},g);
 else if(k==='passive')shape=svgEl('rect',{x:x-r*.72,y:y-r*.72,width:r*1.44,height:r*1.44,rx:1,transform:`rotate(45 ${x} ${y})`},g);
 else if(k==='corner')shape=svgEl('path',{d:`M${x} ${y-r*1.16} L${x+r} ${y} L${x} ${y+r*1.16} L${x-r} ${y} Z`},g);
 else shape=svgEl('circle',{cx:x,cy:y,r},g);
 shape.setAttribute('class','node-outline node-shape');shape.setAttribute('fill',visited?(sel?'#14231f':'#0c1211'):'#0c0c0b');shape.setAttribute('stroke',color);shape.setAttribute('stroke-opacity',visited?'1':'.26');shape.setAttribute('stroke-width',sel?'1.9':'1.15');
 if(k==='corner'){svgEl('path',{d:`M${x-24} ${y}h-5 M${x+24} ${y}h5 M${x} ${y-24}v-5 M${x} ${y+24}v5`,stroke:color,'stroke-opacity':visited?'.8':'.25'},g)}
 const t=svgEl('text',{x,y:y+3.5,'font-size':k==='stat'?'9.8':'10.6','font-weight':sel?'700':'600','text-anchor':'middle',fill:visited?(sel?'#fff':'#f5ebd8'):'#c2b8a5','fill-opacity':visited?'1':'.78'},g);t.textContent=String(n.order);
 });
}
function renderMapDetails(nodes){
 const n=nodes[state.step-1],k=kind(n),size=pageSize(),view=state.mapDetailView,entries=view==='route'?nodes:view==='skills'?build().skills:build().stats,total=Math.max(1,Math.ceil(entries.length/size));state.page=Math.max(0,Math.min(state.page,total-1));const start=state.page*size;
 let txt=k==='active'?'Active skill node. Adds one skill level.':k==='passive'?'Passive skill node. Adds one skill level.':k==='corner'?'Board corner stat.':n.name.includes(',')?'Stat node with multiple listed effects.':'Stat node on the chosen purchase route.';
 if(state.mode==='azphel')txt='Azphel uses a separate crystal pool. Per-click costs are not listed in the source.';
 const offset=`${Math.abs(n.y)} ${n.y<0?'up':'down'} / ${Math.abs(n.x)} ${n.x<0?'left':'right'}`;
 const rows=entries.slice(start,start+size).map((item,index)=>view==='route'?`<button class="step-item" data-step="${item.order}" aria-current="${item.order===state.step}"><span class="step-num">${String(item.order).padStart(2,'0')}</span><span class="step-label">${esc(item.name)}</span><span class="step-cost">${item.cost?`${item.cost} pt`:''}</span></button>`:view==='skills'?`<div class="skill-unit"><div><div class="skill-unit-name">${esc(item.name)}</div><div class="skill-track"><i style="width:${item.level/14*100}%"></i></div></div><div class="skill-level">${item.level}</div></div>`:`<div class="step-item" style="opacity:1;display:block"><span class="step-label" style="white-space:normal">${esc(item)}</span></div>`).join('');
 $('details').innerHTML=`<div class="detail-overview"><div class="inspector-count"><b>${String(n.order).padStart(2,'0')}</b> / ${String(nodes.length).padStart(2,'0')} &nbsp; ${esc(k==='stat'?'Stat':k==='corner'?'Corner':k==='passive'?'Passive skill':'Active skill')}</div><h3>${esc(n.name)}</h3><div class="detail-desc">${esc(txt)}</div><div class="detail-meta"><div><strong>${n.cost??'·'}</strong><small>${n.cost?'Point cost':'Cost per click not listed'}</small></div><div><strong>${n.cost?pointSum(nodes,state.step)+' / '+build().boards[state.board].points:build().boards[state.board].points+' total'}</strong><small>${n.cost?'Spent through step':'Board budget'}</small></div></div></div><div class="step-list"><div class="list-head"><div class="mini-options"><button class="${view==='route'?'active':''}" data-map-view="route">Steps</button><button class="${view==='skills'?'active':''}" data-map-view="skills">Levels</button><button class="${view==='stats'?'active':''}" data-map-view="stats">Stats</button></div><span>${start+1}–${Math.min(entries.length,start+size)} of ${entries.length}</span></div><div class="step-items">${rows}</div><div class="pager"><button id="pageBack" ${state.page===0?'disabled':''}>Previous</button><span>${state.page+1} / ${total}</span><button id="pageNext" ${state.page>=total-1?'disabled':''}>Next</button></div></div>`;
 document.querySelectorAll('[data-step]').forEach(el=>el.addEventListener('click',()=>selectStep(+el.dataset.step)));
 document.querySelectorAll('[data-map-view]').forEach(el=>el.addEventListener('click',()=>setMapDetailView(el.dataset.mapView)));
 $('pageBack').onclick=()=>{if(view==='route')selectStep(Math.max(1,state.page*size));else{state.page--;render(false)}}; $('pageNext').onclick=()=>{if(view==='route')selectStep(Math.min(nodes.length,(state.page+1)*size+1));else{state.page++;render(false)}};
}
function renderSummary(){
 const az=state.mode==='azphel';let o;
 if(az){o={name:'Azphel PvP',boards:[100],value:97.4,skills:[],stats:'HP +400;MP +150;PvP Attack +21;PvP Defense +210;PvP Critical Hit +25;PvP Critical Hit Resist +50;PvP Accuracy +40;PvP Evasion +24;Status Effect Resist +8%;PvP Damage Boost +6%;PvP Damage Tolerance +3%'.split(';')};}
 else o=DATA.full[state.fullMode];
 const boardNames=az?['Azphel']:BOARD_ORDER,values=o.boards,total=az?100:316;
 $('fieldTitle').textContent=az?'Azphel':'Season 1';$('fieldSubtitle').textContent=az?'100-point sample allocation · separate crystal pool':'316-point allocation · same priority method as the 149-point routes';$('fieldNumber').textContent=total;$('fieldNumberLabel').textContent='total points';
 renderLeft(`<h1 class="the-name"><span>${az?'Azphel':'Full'}</span><span>${az?'PvP':'allocation'}</span></h1><p class="subline">${az?'A separate currency pool for PvP. The source provides a 100-point result, but no full 100-point click map.':'Comparison of optimized 316-point allocations. The source gives totals and skill levels but no numbered 316-point click map.'}</p><div class="board-nav">${(az?[['40','40 points / route'],['100','100 points / totals']]:[['heal','PvE healer'],['damage','PvE damage'],['pvp','PvP survival']]).map(([m,n])=>`<button class="board-button ${String(az?state.azphelBudget:state.fullMode)===m?'selected':''}" data-summary="${m}"><span class="bn">${n}</span><span class="bc">${m==='100'?'Summary':m==='40'?'Map':`Value ${DATA.full[m].value}`}</span></button>`).join('')}</div><div class="left-tail"><span>Build value</span><strong>${o.value.toFixed(1)}</strong><small>priority points</small></div>`);
 document.querySelectorAll('[data-summary]').forEach(e=>e.onclick=()=>az?setAzphelBudget(+e.dataset.summary):setFullMode(e.dataset.summary));
 $('stageMeta').innerHTML='<span>Allocation per board</span><span>Source summary only; detailed purchase order not published</span>';
 renderOrbitalSummary(boardNames,values,total);
 const entries=state.summaryCategory==='skills'?o.skills:o.stats.map(s=>({name:s}));const size=pageSize()+1,totalPages=Math.ceil(entries.length/size)||1;
 state.page=Math.max(0,Math.min(state.page,totalPages-1));const start=state.page*size;
 const rows=entries.slice(start,start+size).map(s=>state.summaryCategory==='skills'?`<div class="skill-unit"><div><div class="skill-unit-name" title="${esc(s.name)}">${esc(s.name)}</div><div class="skill-track"><i style="width:${(s.level/14)*100}%"></i></div></div><div class="skill-level">${s.level}</div></div>`:`<div class="skill-unit"><div class="skill-unit-name" title="${esc(s.name)}">${esc(s.name)}</div><div class="skill-level"> </div></div>`).join('');
 $('details').innerHTML=`<div class="detail-overview"><div class="inspector-count">${az?'Separate pool':'Full Season 1'} / ${total} points</div><h3>${esc(o.name)}</h3><div class="detail-desc">${az?'100-point example. No skill nodes on Azphel.':'The source lists these final levels and stat gains, not an exact 316-point purchase sequence.'}</div><div class="rail-switch"><button data-cat="skills" class="${state.summaryCategory==='skills'?'active':''}" ${az?'disabled':''}>Skill levels</button><button data-cat="stats" class="${state.summaryCategory==='stats'?'active':''}">Stat totals</button></div></div><div class="step-list"><div class="list-head"><strong>${state.summaryCategory==='skills'?'Skill outcomes':'Stat outcomes'}</strong><span>${entries.length?start+1:0}–${Math.min(entries.length,start+size)} / ${entries.length}</span></div><div class="step-items">${rows||'<div class="detail-desc">This board has no skill nodes. Select stat totals.</div>'}</div><div class="pager"><button id="pageBack" ${state.page===0?'disabled':''}>Previous</button><span>${state.page+1} / ${totalPages}</span><button id="pageNext" ${state.page>=totalPages-1?'disabled':''}>Next</button></div></div>`;
 if(az&&state.summaryCategory==='skills'){state.summaryCategory='stats';renderSummary();return}
 document.querySelectorAll('[data-cat]').forEach(e=>e.onclick=()=>setSummaryCategory(e.dataset.cat));$('pageBack').onclick=()=>{state.page--;render(false)};$('pageNext').onclick=()=>{state.page++;render(false)};
}
function renderOrbitalSummary(names,nums,total){
 const svg=$('chartSvg');svg.setAttribute('viewBox','-366 -316 732 632');svg.setAttribute('aria-label','Board allocation radial chart');
 svgEl('circle',{cx:0,cy:0,r:194,fill:'none',stroke:'#34322c','stroke-width':'1'},svg);
 svgEl('circle',{cx:0,cy:0,r:129,fill:'none',stroke:'#34322c','stroke-width':'1'},svg);
 let start=-Math.PI/2;const colors=['#a6dcd2','#d2ae73','#b9a9e4','#e8a479'];
 nums.forEach((n,i)=>{let delta=(n/total)*Math.PI*2;
 const arc=(r,a,b)=>{let x1=Math.cos(a)*r,y1=Math.sin(a)*r,x2=Math.cos(b)*r,y2=Math.sin(b)*r;return`M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${b-a>Math.PI?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`};
 svgEl('path',{d:arc(193,start+.012,start+delta-.012),stroke:colors[i], 'stroke-width':9,fill:'none','stroke-linecap':'butt'},svg);
 const mid=start+delta/2,x=Math.cos(mid)*244,y=Math.sin(mid)*244;
 const title=svgEl('text',{x,y:y-5,'text-anchor':'middle',fill:colors[i],'font-size':'13','font-weight':'600'},svg);title.textContent=names[i];
 const qty=svgEl('text',{x,y:y+18,'text-anchor':'middle',fill:'#efeadc','font-size':'19'},svg);qty.textContent=String(n)+' pt';
 start+=delta;
 });
 svgEl('circle',{cx:0,cy:0,r:87,fill:'#080a09',stroke:'#564939','stroke-opacity':'.6'},svg);
 const n=svgEl('text',{x:0,y:12,'text-anchor':'middle',fill:'#efeadc','font-family':'Cormorant Garamond, Georgia, serif','font-size':'70'},svg);n.setAttribute('style','font-family: Cormorant Garamond, Georgia, serif');n.textContent=String(total);
 const sub=svgEl('text',{x:0,y:39,'text-anchor':'middle',fill:'#9f9c90','font-size':'12'},svg);sub.textContent='points';
}
function renderWeights(){
 const category=state.weightCategory,rows=DATA.weights[category],size=window.innerWidth<851?4:5,pages=Math.ceil(rows.length/size);
 state.weightPage=Math.max(0,Math.min(state.weightPage,pages-1));
 $('fieldTitle').textContent=category==='skills'?'Skill priorities':'Stat priorities';$('fieldSubtitle').textContent=category==='skills'?'Value per +1 skill level':'Value per typical stat node';$('fieldNumber').textContent=rows.length;$('fieldNumberLabel').textContent='weighted entries';
 renderLeft(`<h1 class="the-name"><span>Value</span><span>weights</span></h1><p class="subline">Priority values drive the source's allocation model. They are not measured healing, damage, or win rates.</p><div class="board-nav">${[['skills','Skills'],['stats','Stats']].map(([k,n])=>`<button data-weight="${k}" class="board-button ${category===k?'selected':''}"><span class="bn">${n}</span><span class="bc">${DATA.weights[k].length} values</span></button>`).join('')}</div><div class="left-tail"><span>Based on</span><strong>3</strong><small>play styles</small></div>`);
 document.querySelectorAll('[data-weight]').forEach(e=>e.onclick=()=>setWeightCategory(e.dataset.weight));
 $('stageMeta').innerHTML='<span>Value per node, on a shared scale</span>';
 const svg=$('chartSvg');svg.setAttribute('aria-label','Weighted priority matrix');svg.style.display='none';
 let c=$('weightVisual');if(!c){c=document.createElement('div');c.id='weightVisual';c.className='comparisons';$('starfield').append(c)}c.classList.remove('hidden');
 const subset=rows.slice(state.weightPage*size,(state.weightPage+1)*size),max=category==='skills'?14:9;
 c.innerHTML=`<div class="weight-head"><b>PvE healer</b><b>PvE damage</b><b>PvP</b></div>${subset.map(r=>`<div class="comparison-row"><div class="comparison-title">${esc(r.name)}</div><div class="comparison-bars">${r.vals.map(v=>`<div class="comparison-cell"><span>${v}</span><div class="track"><i style="width:${v/max*100}%"></i></div></div>`).join('')}</div></div>`).join('')}`;
 $('details').innerHTML=`<div class="detail-overview"><div class="inspector-count">Priority model / ${category}</div><h3>What the weights mean</h3><div class="detail-desc">Higher values receive higher priority in the optimization. A zero-value node may still be purchased to connect to another node.</div></div><div class="step-list"><div class="list-head"><strong>${category==='skills'?'Skill weights':'Stat weights'}</strong><span>${state.weightPage*size+1}–${Math.min(rows.length,(state.weightPage+1)*size)} of ${rows.length}</span></div><div class="summary-topline">Compare all three styles on the same scale.</div><div class="pager"><button id="pageBack" ${state.weightPage===0?'disabled':''}>Previous</button><span>${state.weightPage+1} / ${pages}</span><button id="pageNext" ${state.weightPage>=pages-1?'disabled':''}>Next</button></div></div>`;
 $('pageBack').onclick=()=>{state.weightPage--;render(false)};$('pageNext').onclick=()=>{state.weightPage++;render(false)};
}
const oldRender=render;render=function(newBoard=false){const w=$('weightVisual');if(w)w.classList.add('hidden');$('chartSvg').style.display='block';oldRender(newBoard);};
// User interactions
for(const e of document.querySelectorAll('.tab'))e.addEventListener('click',()=>selectMode(e.dataset.mode));
$('mobileMode').addEventListener('change',e=>selectMode(e.target.value));
$('mobileBoard').addEventListener('change',e=>{if(state.mode==='full')setFullMode(e.target.value);else if(state.mode==='weights')setWeightCategory(e.target.value);else if(state.mode==='azphel')setAzphelBudget(+e.target.value);else selectBoard(e.target.value)});
$('scrub').addEventListener('input',e=>selectStep(e.target.value));$('prevStep').addEventListener('click',()=>selectStep(state.step-1));$('nextStep').addEventListener('click',()=>selectStep(state.step+1));
$('motionButton').addEventListener('click',()=>{state.paused=!state.paused;$('app').classList.toggle('stop-motion',state.paused);$('motionButton').textContent=state.paused?'Resume motion':'Pause motion';$('motionButton').setAttribute('aria-pressed',String(state.paused))});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&isMap()){e.preventDefault();selectStep(state.step+1)}if(e.key==='ArrowLeft'&&isMap()){e.preventDefault();selectStep(state.step-1)}});
let lastSmall=window.innerWidth<=850;window.addEventListener('resize',()=>{const small=window.innerWidth<=850;if(small!==lastSmall){lastSmall=small;render(false)}});
render(true);
</script>
