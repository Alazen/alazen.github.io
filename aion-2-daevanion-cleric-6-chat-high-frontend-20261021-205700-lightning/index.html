.visual.is-allocation .ambient-stage{opacity:.1}

@keyframes polar-throb{0%,100%{opacity:.28;transform:scale(1)}50%{opacity:.8;transform:scale(1.035)}}

  {x:right,y:cy,s:r.width+cy-top},
  {x:cx,y:bottom,s:r.width+r.height+right-cx},
  {x:left,y:cy,s:2*r.width+r.height+bottom-cy}

  color:ARCHETYPES[state.mode].accent,major});
 if(storms.length>2)storms.splice(0,storms.length-2);
 // The original strike now terminates at the border rather than the board center.
 if(Math.hypot(x-impact.x,y-impact.y)>9){
  chainLightning(x,y,impact.x,impact.y);
  const dx=impact.x-x,dy=impact.y-y;

    'angle':Math.atan2(dy,dx)+'rad'},850);

 const count=Math.max(2,Math.ceil(Math.abs(to-from)/11));
 const out=[];
 for(let i=0;i<=count;i++){
  const a=i/count,s=from+(to-from)*a;
  const n=Math.sin(s*.31+tick*.061+seed)*.65+Math.sin(s*.77-tick*.13+seed*1.7)*.35;
  const p=edgeCoordinate(f,s,n*jitter*Math.sin(a*Math.PI*.93));
  out.push([p.x,p.y]);
 }
 return out;
}
function strokeVoltage(nodes,color,alpha=1,width=2,blur=20){
 if(nodes.length<2||alpha<=0)return;
 pen.save();pen.globalAlpha=alpha;pen.lineCap='round';pen.lineJoin='round';
 pen.strokeStyle=color;pen.lineWidth=width;pen.shadowColor=color;pen.shadowBlur=Math.min(19,blur);
 pen.beginPath();pen.moveTo(nodes[0][0],nodes[0][1]);
 for(let i=1;i<nodes.length;i++)pen.lineTo(nodes[i][0],nodes[i][1]);
 pen.stroke();pen.lineWidth=Math.min(1.25,width*.42);pen.strokeStyle='#f3f9ff';
 pen.shadowBlur=Math.min(7,blur*.3);pen.globalAlpha=alpha*.84;pen.stroke();pen.restore();
}
function stormFork(f,s,tick,seed,color,alpha,depth){
 const p=edgeCoordinate(f,s,0),num=9,out=[];
 for(let i=0;i<=num;i++){
  const q=i/num,z=Math.sin(i*1.83+tick*.19+seed)*11*Math.sin(q*Math.PI);
  const tangent=(i%2?1:-1)*z;
  out.push([p.x+p.nx*depth*q-p.ny*tangent,
            p.y+p.ny*depth*q+p.nx*tangent]);
 }
 strokeVoltage(out,color,alpha,2.15,26);
 const fork=out[5],branch=[[fork[0],fork[1]]];
 for(let i=1;i<=6;i++){
  const q=i/6,side=Math.sin(seed+i*4.1+tick*.08)*9*q;
  branch.push([fork[0]+(p.nx*.58+p.ny*.95)*depth*.56*q+side,
               fork[1]+(p.ny*.58-p.nx*.95)*depth*.56*q-side*.5]);
 }
 strokeVoltage(branch,'#e1ebff',alpha*.72,1.15,15);
}
function paintFrameStorm(timestamp){
 for(let n=storms.length-1;n>=0;n--){
  const z=storms[n],elapsed=timestamp-z.born;
  if(elapsed>=z.duration){storms.splice(n,1);continue}
  const q=Math.min(1,elapsed/z.duration),fade=Math.pow(1-q,1.24),P=2*(z.frame.width+z.frame.height);
  const kick=Math.min(1,elapsed/110),flicker=.65+.35*Math.sin(timestamp*.061+z.seed)**2;
  const base=fade*kick*flicker;
  // The entire rectangle lights up immediately, rather than a point at its center.
  pen.save();pen.globalAlpha=base*.45;pen.strokeStyle=z.color;pen.lineWidth=2.25;pen.shadowColor=z.color;pen.shadowBlur=17;
  pen.strokeRect(z.frame.left,z.frame.top,z.frame.width,z.frame.height);pen.restore();
  // Equal and opposite racing thunderbolts lap every side of the panel.
  for(const dir of [-1,1]){
   const travel=Math.min(1.16,elapsed/(z.major?1120:910))*P*dir;
   const head=z.impact.s+travel;
   const tail=head-dir*Math.min(270,Math.max(90,P*.10));
   const trail=jaggedEdge(z.frame,tail,head,z.seed+dir*41,timestamp,5.6);
   strokeVoltage(trail,z.color,fade*.98,3.9,17);
   strokeVoltage(trail,'#ffffff',fade*.86,1.45,8);
   const tip=edgeCoordinate(z.frame,head);
   pen.save();pen.globalAlpha=fade*.9;pen.fillStyle='#fff';pen.shadowColor=z.color;
   pen.shadowBlur=20;pen.beginPath();pen.arc(tip.x,tip.y,4.4,0,Math.PI*2);pen.fill();pen.restore();
   // Lightning fingers crawl inward from each electric head.
   stormFork(z.frame,head-dir*Math.min(35,P*.04),timestamp,z.seed+dir*17,
             z.color,fade*.72,Math.min(z.frame.width,z.frame.height)*.19);
  }
  // Four independently flickering corner discharges make the whole panel react.
  for(let k=0;k<4;k++){
   const delay=65+k*110,local=(elapsed-delay)/520;
   if(local<0||local>=1)continue;
   const s=[0,z.frame.width,z.frame.width+z.frame.height,2*z.frame.width+z.frame.height][k];
   stormFork(z.frame,s+(k%2?14:-14),timestamp,z.seed+37*k,'#d4dfff',
            Math.sin(local*Math.PI)*.62,Math.min(z.frame.width,z.frame.height)*.30);
  }
 }
}
window.addEventListener('resize',()=>{storms.length=0;stormField.classList.remove('is-live')},{passive:true});

const spellCanvas=$('spellCanvas'),pen=spellCanvas.getContext('2d',{alpha:true});
let dust=[],electrics=[],paintFrame=0,paintLast=0,canvasW=0,canvasH=0;
const rand=(a,b)=>a+Math.random()*(b-a);
function colorSet(){return [ARCHETYPES[state.mode].accent,'#e7c891','#ffffff','#9bcfdf']}
function sizeSpell(){const r=$('app').getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);canvasW=r.width;canvasH=r.height;spellCanvas.width=Math.max(1,Math.round(r.width*dpr));spellCanvas.height=Math.max(1,Math.round(r.height*dpr));pen.setTransform(dpr,0,0,dpr,0,0)}
sizeSpell();window.addEventListener('resize',sizeSpell,{passive:true});
function startPaint(){if(!paintFrame&&!state.motion)paintFrame=requestAnimationFrame(paintMagic)}
function spark(x,y,vx,vy,life,color,size=2,spin=0){if(dust.length>220)dust.splice(0,dust.length-220);dust.push({x,y,vx,vy,life,t:0,color,size,spin,rot:Math.random()*Math.PI,tail:rand(.12,.37)});startPaint()}
function scatter(x,y,count=45,kind='impact'){
 if(state.motion)return;const palette=colorSet();for(let j=0;j<count;j++){const angle=(Math.PI*2*j/count)+rand(-.09,.09);const radius=kind==='hover'?rand(23,125):rand(90,365);spark(x,y,Math.cos(angle)*radius+rand(-20,20),Math.sin(angle)*radius+rand(-20,20),kind==='hover'?rand(.31,.75):rand(.48,1.1),palette[j%palette.length],rand(.9,3.2),rand(-10,10))}
}
function lightning(x0,y0,x1,y1,strength=1){if(state.motion)return;const dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy);if(len<8)return;const seg=Math.max(4,Math.min(30,Math.round(len/17))),nodes=[];for(let j=0;j<=seg;j++){const t=j/seg,w=Math.sin(t*Math.PI)*Math.min(22,len*.13)*strength;nodes.push([x0+dx*t+(-dy/len)*rand(-w,w),y0+dy*t+(dx/len)*rand(-w,w)])}electrics.push({nodes,t:0,life:rand(.19,.39),color:Math.random()>.35?ARCHETYPES[state.mode].accent:'#e7c891'});if(electrics.length>20)electrics.shift();startPaint()}
function chainLightning(x0,y0,x1,y1){lightning(x0,y0,x1,y1,1.05);setTimeout(()=>lightning(x0,y0,x1,y1,.65),100);setTimeout(()=>lightning(x0,y0,x1,y1,1.4),195)}
function paintMagic(timestamp){paintFrame=0;const dt=Math.min((timestamp-(paintLast||timestamp))/1000,.06);paintLast=timestamp;pen.clearRect(0,0,canvasW,canvasH);if(state.motion){dust=[];electrics=[];return}pen.save();pen.globalCompositeOperation='lighter';
 for(let i=dust.length-1;i>=0;i--){const p=dust[i];p.t+=dt;if(p.t>p.life){dust.splice(i,1);continue}const q=p.t/p.life;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.989;p.vy*=.989;p.rot+=p.spin*dt;const alpha=(1-q)**1.25;pen.globalAlpha=alpha;pen.strokeStyle=p.color;pen.fillStyle=p.color;pen.shadowColor=p.color;pen.shadowBlur=14*(1-q);pen.lineWidth=Math.max(.55,p.size*(1-q));pen.beginPath();pen.moveTo(p.x-p.vx*p.tail*dt*5,p.y-p.vy*p.tail*dt*5);pen.lineTo(p.x,p.y);pen.stroke();pen.save();pen.translate(p.x,p.y);pen.rotate(p.rot);pen.fillRect(-p.size/2,-p.size/2,p.size,p.size*2.1);pen.restore()}
 for(let i=electrics.length-1;i>=0;i--){const a=electrics[i];a.t+=dt;if(a.t>a.life){electrics.splice(i,1);continue}const progress=a.t/a.life;pen.globalAlpha=Math.pow(1-progress,.7);pen.shadowColor=a.color;pen.shadowBlur=22;pen.strokeStyle=a.color;pen.lineWidth=2.3*(1-progress)+.45;pen.beginPath();const n=Math.max(1,Math.ceil((a.nodes.length-1)*Math.min(1,progress*4)));pen.moveTo(...a.nodes[0]);for(let j=1;j<=n;j++)pen.lineTo(...a.nodes[j]);pen.stroke();pen.shadowBlur=0;pen.strokeStyle='#ffffff';pen.lineWidth=.55;pen.stroke()}
 paintFrameStorm(timestamp);pen.restore();if(dust.length||electrics.length||storms.length)paintFrame=requestAnimationFrame(paintMagic)
}
function clearMagic(){dust=[];electrics=[];storms.length=0;stormField.classList.remove('is-live');clearTimeout(stormTimeout);stormCycle++;if(paintFrame)cancelAnimationFrame(paintFrame);paintFrame=0;paintLast=0;pen.clearRect(0,0,canvasW,canvasH)}

const sigil=$('cursorSigil');let lastPointer=null,hovered=null,lastTrail=0,charge=null;
const interactiveSelector='button:not(:disabled), input[type="range"], g.point, a.external, a.footer-source';
function interactiveFrom(e){const t=e.target.closest(interactiveSelector);return t&&$('app').contains(t)?t:null}
function moveSigil(p,visible){sigil.style.left=p.x+'px';sigil.style.top=p.y+'px';sigil.classList.toggle('visible',Boolean(visible)&&!state.motion)}
function updateHotspot(target,e){if(!target||!Number.isFinite(e.clientX)||!Number.isFinite(e.clientY))return;const r=target.getBoundingClientRect();target.style.setProperty('--hot-x',(e.clientX-r.left)+'px');target.style.setProperty('--hot-y',(e.clientY-r.top)+'px');target.classList.add('spell-target')}
function hoverFx(e){if(state.motion||e.pointerType==='touch')return;const target=interactiveFrom(e);if(!target||target===hovered)return;hovered=target;const p=pointerPoint(e,target);moveSigil(p,true);updateHotspot(target,e);burst(p.x,p.y,'hover');scatter(p.x,p.y,15,'hover');lastPointer={...p,time:performance.now()}}
document.addEventListener('pointerover',hoverFx,{passive:true});
document.addEventListener('pointermove',e=>{
 if(state.motion||e.pointerType==='touch')return;const t=interactiveFrom(e),p=pointerPoint(e,t||$('visual'));if(t!==hovered){hovered=t;if(t){burst(p.x,p.y,'hover');scatter(p.x,p.y,14,'hover')}}moveSigil(p,!!t);if(!t){lastPointer=null;return}updateHotspot(t,e);
 const now=performance.now();if(lastPointer){const dx=p.x-lastPointer.x,dy=p.y-lastPointer.y,dist=Math.hypot(dx,dy);if(dist>8&&now-lastTrail>22){const speed=Math.min(3,dist/14);const colors=colorSet();for(let j=0;j<Math.min(5,1+Math.floor(speed*1.2));j++){const a=Math.atan2(dy,dx)+Math.PI/2;const side=j%2===0?1:-1;spark(p.x+rand(-4,4),p.y+rand(-4,4),-dx*rand(2,4)+Math.cos(a)*rand(25,85)*side,-dy*rand(2,4)+Math.sin(a)*rand(25,85)*side,rand(.23,.54),colors[j%4],rand(.7,2))}if(dist>27)lightning(lastPointer.x,lastPointer.y,p.x,p.y,.38);lastTrail=now}}
 lastPointer={...p,time:now};if(charge){charge.style.setProperty('--fx-x',p.x+'px');charge.style.setProperty('--fx-y',p.y+'px')}
},{passive:true});
document.addEventListener('pointerout',e=>{const leaving=e.target.closest(interactiveSelector);if(leaving&&(!e.relatedTarget||!leaving.contains(e.relatedTarget))){if(hovered===leaving){hovered=null;sigil.classList.remove('visible');lastPointer=null}}},{passive:true});
document.addEventListener('pointerdown',e=>{if(state.motion||e.button!==0)return;const target=interactiveFrom(e);if(!target)return;const p=pointerPoint(e,target);if(charge)charge.remove();charge=makeFx('fx-hold',p.x,p.y,{},4000);scatter(p.x,p.y,11,'hover')},{passive:true});
function releaseCharge(){if(charge){charge.remove();charge=null}}document.addEventListener('pointerup',releaseCharge,{passive:true});document.addEventListener('pointercancel',releaseCharge,{passive:true});window.addEventListener('blur',()=>{releaseCharge();sigil.classList.remove('visible')});
document.addEventListener('click',e=>{
 const btn=e.target.closest('button');if(!btn||btn.disabled)return;
 const clickOrigin=pointerPoint(e,btn);let kind='minor';
 if(btn.dataset.mode){setMode(btn.dataset.mode);kind='mode'}
 else if(btn.dataset.budget){state.budget=btn.dataset.budget;state.step=1;state.progress=100;state.chartPage=0;render();kind='budget'}
 else if(btn.dataset.board){setBoard(btn.dataset.board);kind='board'}
 else if(btn.dataset.view){setView(btn.dataset.view);kind='view'}
 else if(btn.dataset.step){setStep(+btn.dataset.step)}
 else if(btn.id==='prev')setStep(state.step-1);
 else if(btn.id==='next')setStep(state.step+1);
 else if(btn.dataset.page){state.chartPage+=btn.dataset.page==='next'?1:-1;render();kind='page'}
 else if(btn.dataset.weight){state.weightsTab=btn.dataset.weight;state.chartPage=0;render();kind='tab'}
 else if(btn.dataset.skillstab){state.skillsTab=btn.dataset.skillstab;state.chartPage=0;render();kind='tab'}
 else if(btn.dataset.position){state.positionSelected=DATA.skillPositions[+btn.dataset.position].name;render()}
 else if(btn.dataset.positionpage){state.positionPage+=btn.dataset.positionpage==='next'?1:-1;render();kind='page'}
 else if(btn.id==='copyBtn'){copyBuild();kind='copy'}
 else if(btn.id==='motionToggle'){
   state.motion=!state.motion;document.body.classList.toggle('motion-off',state.motion);
   btn.textContent=state.motion?'Resume motion':'Pause motion';btn.setAttribute('aria-pressed',String(state.motion));
   if(state.motion){$('fxLayer').querySelectorAll(':scope > :not(#cursorSigil)').forEach(el=>el.remove());sigil.classList.remove('visible');releaseCharge();clearMagic();$('visual').querySelectorAll('.scene-warp').forEach(el=>el.remove())}else interactionFx(btn,'resume');
   return;
 }
 if(!state.motion){burst(clickOrigin.x,clickOrigin.y);scatter(clickOrigin.x,clickOrigin.y,['mode','board','budget','view'].includes(kind)?72:42);if(['mode','board','budget','view'].includes(kind)){beamToBoard(clickOrigin.x,clickOrigin.y);sceneWarp(clickOrigin)}else{summonFrameStorm(clickOrigin.x,clickOrigin.y,false)}}
});
document.addEventListener('input',e=>{if(e.target.id==='progressRange'){state.progress=100*(+e.target.value/Math.max(1,path().length));state.step=Math.max(1,+e.target.value);let svg=$('boardSvg');if(svg)svg.outerHTML=renderPathSvg();let num=document.querySelector('.dock-num');if(num)num.innerHTML=`<b>${activeCount()}</b> / ${path().length} shown`;let prev=$('prev'),next=$('next');if(prev)prev.disabled=state.step<=1;if(next)next.disabled=state.step>=path().length;renderInspectorPath()}});
document.addEventListener('click',e=>{const node=e.target.closest('g[data-step],g[data-position]');if(!node)return;const p=pointerPoint(e,node);if(node.dataset.step)setStep(+node.dataset.step);else{state.positionSelected=DATA.skillPositions[+node.dataset.position].name;render()}burst(p.x,p.y);scatter(p.x,p.y,36);summonFrameStorm(p.x,p.y,false)});
document.addEventListener('keydown',e=>{if(e.target.matches('input')||e.metaKey||e.ctrlKey||e.altKey)return;const node=e.target.closest('g[data-step],g[data-position]');if(node&&(e.key==='Enter'||e.key===' ')){e.preventDefault();node.dispatchEvent(new MouseEvent('click',{bubbles:true}));return}if(state.view==='atlas'&&hasPath()&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();setStep(state.step+(e.key==='ArrowLeft'?-1:1))}});
render();
</script>
