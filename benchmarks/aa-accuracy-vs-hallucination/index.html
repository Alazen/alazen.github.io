  function normToValue(t, min, max, isLog) {
    const clamped = Math.max(0, Math.min(1, t));
    if (isLog && min > 0 && max > min) {
      return Math.exp(Math.log(min) + clamped * (Math.log(max) - Math.log(min)));
    }
    return min + clamped * (max - min);
  }

  function valueToNorm(val, min, max, isLog) {
    if (max <= min) return 0;
    if (isLog && min > 0 && val > 0) {
      return Math.max(0, Math.min(1, (Math.log(val) - Math.log(min)) / (Math.log(max) - Math.log(min))));
    }
    return Math.max(0, Math.min(1, (val - min) / (max - min)));
  }

  function computeFitNormRange(metricKey, models) {
    if (!models || !models.length) return [0, 1];
    const spec = METRICS[metricKey];
    const [bMin, bMax] = spec.baseBounds();
    const isLog = spec.isLog();
    let nMin = Infinity;
    let nMax = -Infinity;
    for (const m of models) {
      const n = valueToNorm(m[metricKey], bMin, bMax, isLog);
      if (n < nMin) nMin = n;
      if (n > nMax) nMax = n;
    }
    if (!Number.isFinite(nMin) || !Number.isFinite(nMax)) return [0, 1];
    const span = Math.max(0, nMax - nMin);
    const pad = span < 1e-6 ? 0.08 : Math.min(0.08, Math.max(0.04, span * 0.11));
    let fitMin = Math.max(0, nMin - pad);
    let fitMax = Math.min(1, nMax + pad);
    const minSpan = Math.max(MIN_NORM_GAP, 0.08);
    if (fitMax - fitMin < minSpan) {
      if (fitMin <= 0.001) fitMax = Math.min(1, minSpan);
      else if (fitMax >= 0.999) fitMin = Math.max(0, 1 - minSpan);
      else {
        const mid = (fitMin + fitMax) / 2;
        fitMin = Math.max(0, mid - minSpan / 2);
        fitMax = Math.min(1, mid + minSpan / 2);
      }
    }
    return [fitMin, fitMax];
  }

  function isRangeZoomed(range) {
    return range[0] > 0.002 || range[1] < 0.998;

  function isAnyZoomed() {
    return isRangeZoomed(state.xRange) || isRangeZoomed(state.yRange);

  function applyZoomToData() {
    const models = visibleModels();

      return;
    }
    const xr = computeFitNormRange(state.xMetric, models);
    const yr = computeFitNormRange(state.yMetric, models);
    state.xRange = isRangeZoomed(xr) ? xr : [0, 1];
    state.yRange = isRangeZoomed(yr) ? yr : [0, 1];
  }

  const URL_PARAM_KEYS = ['y', 'x', 'scale', 'creators', 'models', 'hide', 'zoom', 'xr', 'yr', 'labels', 'lines', 'lock'];
  const DEFAULT_Y_METRIC = 'accuracy';
  const DEFAULT_X_METRIC = 'hallucinationRate';
  const MODEL_SLUG_SET = new Set(MODELS.map(m => m.slug));
  const MODEL_FAMILY_SET = new Set(MODELS.map(m => m.family));

  function formatUrlBound(metricKey, val) {
    const unit = METRICS[metricKey].unit;
    if (unit === 'pct') return String(Number(val.toFixed(4)));
    if (unit === 'elo') return String(Number(val.toFixed(1)));
    return String(Number(val.toPrecision(5)));
  }

  function parseUrlRange(raw, metricKey) {
    if (!raw) return null;
    const parts = raw.split(',');
    if (parts.length !== 2) return null;
    const vMin = Number(parts[0]);
    const vMax = Number(parts[1]);
    if (!Number.isFinite(vMin) || !Number.isFinite(vMax) || vMax <= vMin) return null;
    const spec = METRICS[metricKey];
    const [bMin, bMax] = spec.baseBounds();
    const isLog = spec.isLog();
    if (isLog && (vMin <= 0 || vMax <= 0)) return null;
    const nMin = Math.max(0, Math.min(1 - MIN_NORM_GAP, valueToNorm(vMin, bMin, bMax, isLog)));
    const nMax = Math.min(1, Math.max(nMin + MIN_NORM_GAP, valueToNorm(vMax, bMin, bMax, isLog)));
    const zoomed = nMin > 0.002 || nMax < 0.998;
    return zoomed ? [nMin, nMax] : [0, 1];
  }

  function applyUrlState() {
    let params;
    try {
      params = new URLSearchParams(window.location.search);
    } catch (_) {
      return;
    }
    if (![...params.keys()].some(k => URL_PARAM_KEYS.includes(k))) return;

    const yParam = params.get('y');
    const xParam = params.get('x');
    if (yParam && AXIS_KEYS.includes(yParam)) state.yMetric = yParam;
    if (xParam && AXIS_KEYS.includes(xParam)) state.xMetric = xParam;
    if (state.xMetric === state.yMetric) {
      if (yParam && !xParam) {
        state.xMetric = state.yMetric === DEFAULT_X_METRIC ? DEFAULT_Y_METRIC : DEFAULT_X_METRIC;
      } else {
        state.yMetric = state.xMetric === DEFAULT_Y_METRIC ? DEFAULT_X_METRIC : DEFAULT_Y_METRIC;
      }
    }

    const scaleParam = params.get('scale');
    if (scaleParam === 'log' || scaleParam === 'linear') {
      state.costScale = scaleParam;
    }

    const creatorsParam = params.get('creators');
    if (creatorsParam !== null) {
      const parsed = creatorsParam.split(',').map(s => s.trim()).filter(s => ALL_CREATORS.includes(s));
      if (parsed.length) state.creators = new Set(parsed);
    }

    const modelsParam = params.get('models');
    const hideParam = params.get('hide');
    if (modelsParam !== null) {
      if (modelsParam === 'none' || modelsParam === '') {
        state.selectedSlugs = new Set();
      } else {
        const parsed = modelsParam.split(',').map(s => s.trim()).filter(s => MODEL_SLUG_SET.has(s));
        if (parsed.length) state.selectedSlugs = new Set(parsed);
      }
    } else if (hideParam !== null) {
      const hidden = new Set(hideParam.split(',').map(s => s.trim()).filter(s => MODEL_SLUG_SET.has(s)));
      if (hidden.size) {
        state.selectedSlugs = new Set(MODELS.map(m => m.slug).filter(s => !hidden.has(s)));
      }
    }

    const labelsParam = params.get('labels');
    if (labelsParam === '0' || labelsParam === 'false') state.showLabels = false;
    else if (labelsParam === '1' || labelsParam === 'true') state.showLabels = true;

    const linesParam = params.get('lines');
    if (linesParam === '1' || linesParam === 'true') state.showFamilyLines = true;
    else if (linesParam === '0' || linesParam === 'false') state.showFamilyLines = false;

    const lockParam = params.get('lock');
    if (lockParam && MODEL_FAMILY_SET.has(lockParam)) {
      state.lockedFamily = lockParam;
    }

    const zoomParam = params.get('zoom');
    const xrParam = params.get('xr');
    const yrParam = params.get('yr');
    if (zoomParam === 'full') {
      state.zoomToData = false;
      state.xRange = [0, 1];
      state.yRange = [0, 1];
    } else if (xrParam || yrParam) {
      const parsedX = parseUrlRange(xrParam, state.xMetric);
      const parsedY = parseUrlRange(yrParam, state.yMetric);
      if (parsedX || parsedY) {
        state.zoomToData = false;
        state.xRange = parsedX || [0, 1];
        state.yRange = parsedY || [0, 1];
      }
    } else if (zoomParam === 'fit') {
      state.zoomToData = true;
    }
  }

  function syncUrlState() {
    if (urlSyncTimer) {
      clearTimeout(urlSyncTimer);
      urlSyncTimer = null;
    }
    try {
      const params = new URLSearchParams(window.location.search);
      for (const k of URL_PARAM_KEYS) params.delete(k);

      if (state.yMetric !== DEFAULT_Y_METRIC) params.set('y', state.yMetric);
      if (state.xMetric !== DEFAULT_X_METRIC) params.set('x', state.xMetric);
      if (state.costScale !== 'log') params.set('scale', state.costScale);

      if (state.creators.size < ALL_CREATORS.length) {
        const orderedCreators = ALL_CREATORS.filter(c => state.creators.has(c));
        params.set('creators', orderedCreators.join(','));
      }

      if (state.selectedSlugs.size === 0) {
        params.set('models', 'none');
      } else if (state.selectedSlugs.size < MODELS.length) {
        const selectedOrdered = MODELS.map(m => m.slug).filter(s => state.selectedSlugs.has(s));
        const hiddenOrdered = MODELS.map(m => m.slug).filter(s => !state.selectedSlugs.has(s));
        if (hiddenOrdered.length < selectedOrdered.length) {
          params.set('hide', hiddenOrdered.join(','));
        } else {
          params.set('models', selectedOrdered.join(','));
        }
      }

      if (!state.zoomToData) {
        const xZoomed = isRangeZoomed(state.xRange);
        const yZoomed = isRangeZoomed(state.yRange);
        if (!xZoomed && !yZoomed) {
          params.set('zoom', 'full');
        } else {
          if (xZoomed) {
            const xd = getAxisDomain('x');
            params.set('xr', `${formatUrlBound(xd.key, xd.min)},${formatUrlBound(xd.key, xd.max)}`);
          }
          if (yZoomed) {
            const yd = getAxisDomain('y');
            params.set('yr', `${formatUrlBound(yd.key, yd.min)},${formatUrlBound(yd.key, yd.max)}`);
          }
        }
      }

      if (!state.showLabels) params.set('labels', '0');
      if (state.showFamilyLines) params.set('lines', '1');
      if (state.lockedFamily) params.set('lock', state.lockedFamily);

      const qs = params.toString();
      const nextUrl = window.location.pathname + (qs ? '?' + qs : '') + window.location.hash;
      const curUrl = window.location.pathname + window.location.search + window.location.hash;
      if (nextUrl !== curUrl) {
        history.replaceState(null, '', nextUrl);
      }
    } catch (_) {}
  }

  function scheduleUrlSync(immediate = false) {
    if (immediate) {
      syncUrlState();
      return;
    }
    if (urlSyncTimer) clearTimeout(urlSyncTimer);
    urlSyncTimer = setTimeout(syncUrlState, 120);
  }

  function getAxisDomain(axis) {
    const metricKey = axis === 'x' ? state.xMetric : state.yMetric;
    const range = axis === 'x' ? state.xRange : state.yRange;
    const spec = METRICS[metricKey];
    const [baseMin, baseMax] = spec.baseBounds();
    const isLog = spec.isLog();
    const zoomed = isRangeZoomed(range);
    if (!zoomed) {
      return {
        key: metricKey,
        min: baseMin,
        max: baseMax,
        baseMin,
        baseMax,
        normMin: 0,
        normMax: 1,
        isLog,
        isZoomed: false
      };
    }
    return {
      key: metricKey,
      min: normToValue(range[0], baseMin, baseMax, isLog),
      max: normToValue(range[1], baseMin, baseMax, isLog),
      baseMin,
      baseMax,
      normMin: range[0],
      normMax: range[1],
      isLog,
      isZoomed: true
    };
  }

  function mapAxisValue(v, dom) {
    if (dom.isLog) {
      const lo = Math.log10(dom.min);
      const hi = Math.log10(dom.max);
      if (hi <= lo) return 0;
      return (Math.log10(Math.max(1e-9, v)) - lo) / (hi - lo);
    }
    if (dom.max <= dom.min) return 0;
    return (v - dom.min) / (dom.max - dom.min);
  }

  function inDomain(v, dom) {
    if (dom.isLog) {
      return v >= dom.min * 0.999 && v <= dom.max * 1.001;
    }
    const eps = (dom.max - dom.min) * 1e-4;
    return v >= dom.min - eps && v <= dom.max + eps;
  }

  function buildAxisTicks(dom) {
    const lo = dom.min;
    const hi = dom.max;
    const span = Math.max(1e-9, hi - lo);
    const unit = METRICS[dom.key].unit;

    if (unit === 'usd' && dom.isLog) {
      const minExp = Math.floor(Math.log10(Math.max(1e-6, lo)));
      const maxExp = Math.ceil(Math.log10(Math.max(1e-6, hi)));
      const candidateSets = [
        [1, 10],
        [1, 2, 5],
        [1, 1.5, 2, 3, 5, 7],
        [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8],
        [1, 1.1, 1.2, 1.3, 1.5, 1.7, 2, 2.5, 3, 3.5, 4, 5, 6, 7, 8, 9]
      ];
      if (!dom.isZoomed) {
        return {
          values: dom.key === 'briefcaseTotalCost' ? [1, 10, 100, 1000] : [0.1, 1, 10, 100, 1000],
          step: null
        };
      }
      for (const mults of candidateSets) {
        const ticks = [];
        for (let e = minExp; e <= maxExp; e++) {
          const pow = Math.pow(10, e);
          for (const m of mults) {
            const v = Number((m * pow).toPrecision(6));
            if (v >= lo * 0.9999 && v <= hi * 1.0001) {
              if (!ticks.length || Math.abs(v - ticks[ticks.length - 1]) > v * 1e-4) {
                ticks.push(v);
              }
            }
          }
        }
        if (ticks.length >= 3 && ticks.length <= 7) {
          return { values: ticks, step: null };
        }
        if (ticks.length > 7) {
          const stride = Math.ceil(ticks.length / 6);
          return { values: ticks.filter((_, idx) => idx % stride === 0), step: null };
        }
      }
      const fallback = [];
      for (let i = 1; i <= 4; i++) {
        fallback.push(normToValue(i / 5, lo, hi, true));
      }
      return { values: fallback, step: span / 5 };
    }

    const steps = unit === 'usd'
      ? [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500]
      : unit === 'elo'
        ? [2, 5, 10, 20, 25, 50, 100, 200, 250, 300]
        : [0.002, 0.005, 0.01, 0.02, 0.025, 0.05, 0.1, 0.2, 0.25];
    let step = steps[steps.length - 1];
    for (const s of steps) {
      if (span / s <= 6.2) {
        step = s;
        break;
      }
    }
    const values = [];
    const start = Math.ceil(lo / step - 1e-9) * step;
    for (let v = start; v <= hi + step * 1e-6; v += step) {
      const clean = Number(v.toPrecision(6));
      if (clean >= lo - span * 1e-4 && clean <= hi + span * 1e-4) {
        values.push(clean);
      }
    }
    if (values.length < 2) {
      return { values: [lo, (lo + hi) / 2, hi], step: span / 2 };
    }
    return { values, step };
  }

  function formatTickValue(key, val, step) {
    const unit = METRICS[key].unit;
    if (unit === 'usd') {
      if (val === 0) return '$0';
      if (val < 0.1) return '$' + val.toFixed(2);
      if (val < 1) {
        const s = val.toFixed(2);
        return s.endsWith('0') ? '$' + val.toFixed(2) : '$' + s;
      }
      if (val < 10) {
        return Math.abs(val - Math.round(val)) < 0.005
          ? '$' + Math.round(val)
          : '$' + Number(val.toFixed(2));
      }
      if (Math.abs(val - Math.round(val)) < 0.05) {
        return '$' + Math.round(val).toLocaleString('en-US');
      }
      return '$' + val.toFixed(1);
    }
    if (unit === 'elo') {
      const needDecimal = step != null && step < 5 && Math.abs(val - Math.round(val)) > 0.05;
      return needDecimal ? val.toFixed(1) : Math.round(val).toLocaleString('en-US');
    }
    const pctVal = val * 100;
    const needDecimal = (step != null && step < 0.01) || Math.abs(pctVal - Math.round(pctVal)) > 0.05;
    return pctVal.toFixed(needDecimal ? 1 : 0) + '%';
  }

  function formatZoomReadout(key, val, span) {
    const unit = METRICS[key].unit;
    if (unit === 'usd') {
      if (val < 1) return '$' + val.toFixed(2);
      if (val < 10) return '$' + val.toFixed(2);
      if (val < 100) return span < 30 ? '$' + val.toFixed(1) : '$' + Math.round(val);
      return '$' + Math.round(val).toLocaleString('en-US');
    }
    if (unit === 'elo') {
      return span < 35 ? val.toFixed(1) : Math.round(val).toLocaleString('en-US');
    }
    const pctVal = val * 100;
    const decimals = span < 0.12 ? 1 : 0;
    return pctVal.toFixed(decimals) + '%';
  }

  function creatorColor(slug) {
    if (slug === 'google') return '#38c15c';
    if (slug === 'anthropic') return '#ea7b4f';
    return '#f5f5f7';
  }

  function passesThreshold(m, key) {
    const spec = METRICS[key];
    return spec.better === 'high' ? m[key] >= spec.threshold : m[key] <= spec.threshold;
  }

  function isAttractive(m) {
    return passesThreshold(m, state.yMetric) && passesThreshold(m, state.xMetric);
  }

  function isCostMetric(key) {
    return METRICS[key].unit === 'usd';
  }

  function hasCostAxis() {
    return isCostMetric(state.xMetric) || isCostMetric(state.yMetric);
  }

  function visibleModels() {
    return MODELS.filter(m => state.creators.has(m.creatorSlug) && state.selectedSlugs.has(m.slug));
  }

  function computeParetoFrontier(models, xKey, yKey) {
    if (!models || !models.length) return [];
    const xHigh = METRICS[xKey].better === 'high';
    const yHigh = METRICS[yKey].better === 'high';
    const sorted = [...models].sort((a, b) => {
      const dx = xHigh ? b[xKey] - a[xKey] : a[xKey] - b[xKey];
      if (Math.abs(dx) > 1e-12) return dx;
      return yHigh ? b[yKey] - a[yKey] : a[yKey] - b[yKey];
    });
    const frontier = [];
    let bestY = yHigh ? -Infinity : Infinity;
    for (const m of sorted) {
      const yVal = m[yKey];
      const strictlyBetterY = yHigh ? yVal > bestY + 1e-12 : yVal < bestY - 1e-12;
      const equalY = Math.abs(yVal - bestY) <= 1e-12;
      const sameXAsPrev = frontier.length > 0 && Math.abs(m[xKey] - frontier[frontier.length - 1][xKey]) <= 1e-12;
      if (strictlyBetterY) {
        frontier.push(m);
        bestY = yVal;
      } else if (equalY && sameXAsPrev) {
        frontier.push(m);
      }
    }
    return frontier;
  }

  function fitToolbarButtons() {
    toolbar.classList.remove('is-tight', 'is-tighter');
    if (toolbar.scrollWidth > toolbar.clientWidth + 1) {
      toolbar.classList.add('is-tight');
      if (toolbar.scrollWidth > toolbar.clientWidth + 1) {
        toolbar.classList.add('is-tighter');
      }
    }
  }

  function syncZoomButton() {
    const zoomed = isAnyZoomed();
    state.zoomed = zoomed;
    zoomBtn.setAttribute('aria-pressed', String(state.zoomToData || zoomed));
    if (state.zoomToData) {
      zoomBtn.textContent = 'Zoomed to data';
    } else if (zoomed) {
      zoomBtn.textContent = 'Reset zoom';
    } else {
      const bothPercent = METRICS[state.xMetric].unit === 'pct' && METRICS[state.yMetric].unit === 'pct';
      zoomBtn.textContent = bothPercent ? 'Full scale (0% to 100%)' : 'Full scale';
    }
    zoomBtn.title = zoomBtn.textContent;
    fitToolbarButtons();
  }

  function syncAxisCopy() {
    const ySpec = METRICS[state.yMetric];
    const xSpec = METRICS[state.xMetric];
    document.title = `${ySpec.title} vs. ${xSpec.title}`;
    costScaleBtn.hidden = !hasCostAxis();
    syncZoomButton();
    plot.setAttribute('aria-label', `Scatter plot of ${ySpec.title} versus ${xSpec.title} across ${MODELS.length} OpenAI, Google, and Anthropic models.`);
  }

  function closeAxisMenu() {
    if (!state.openAxisMenu && axisMenu.hidden) return;
    state.openAxisMenu = null;
    axisMenu.hidden = true;
    for (const el of plot.querySelectorAll('.axis-title-btn')) {
      el.setAttribute('aria-expanded', 'false');
    }
  }

  function selectAxisMetric(axis, key) {
    if (axis === 'y') {
      if (key === state.xMetric) {
        state.xMetric = state.yMetric;
        const tmp = state.xRange;
        state.xRange = state.yRange;
        state.yRange = tmp;
      } else if (!state.zoomToData && key !== state.yMetric) {
        state.yRange = [0, 1];
      }
      state.yMetric = key;
    } else {
      if (key === state.yMetric) {
        state.yMetric = state.xMetric;
        const tmp = state.xRange;
        state.xRange = state.yRange;
        state.yRange = tmp;
      } else if (!state.zoomToData && key !== state.xMetric) {
        state.xRange = [0, 1];
      }
      state.xMetric = key;
    }
    closeAxisMenu();
    applyAxisChange();
  }

  function openAxisMenu(axis, anchor) {
    if (state.openAxisMenu === axis && !axisMenu.hidden) {
      closeAxisMenu();
      return;
    }
    state.openAxisMenu = axis;
    const currentKey = axis === 'y' ? state.yMetric : state.xMetric;
    const otherKey = axis === 'y' ? state.xMetric : state.yMetric;
    const otherLabel = axis === 'y' ? 'X axis' : 'Y axis';

    axisMenu.replaceChildren();
    const title = document.createElement('div');
    title.className = 'axis-menu-title';
    title.textContent = axis === 'y' ? 'Y axis metric' : 'X axis metric';
    axisMenu.appendChild(title);

    for (const key of AXIS_KEYS) {
      const spec = METRICS[key];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'axis-menu-item';
      btn.setAttribute('role', 'option');
      btn.setAttribute('aria-selected', String(key === currentKey));

      const nameSpan = document.createElement('span');
      nameSpan.textContent = spec.title;
      btn.appendChild(nameSpan);

      if (key === currentKey || key === otherKey) {
        const badge = document.createElement('span');
        badge.className = 'axis-menu-badge';
        badge.textContent = key === currentKey ? 'Active' : otherLabel;
        btn.appendChild(badge);
      }

      btn.addEventListener('click', e => {
        e.stopPropagation();
        selectAxisMetric(axis, key);
      });
      axisMenu.appendChild(btn);
    }

    axisMenu.hidden = false;
    for (const el of plot.querySelectorAll('.axis-title-btn')) {
      el.setAttribute('aria-expanded', String(el.dataset.axis === axis));
    }

    const shellW = shell.clientWidth;
    const shellH = shell.clientHeight;
    const mw = axisMenu.offsetWidth;
    const mh = axisMenu.offsetHeight;
    let leftPos;
    let topPos;
    if (axis === 'y') {
      leftPos = Math.min(shellW - mw - 6, Math.max(6, anchor.x + 16));
      topPos = Math.min(shellH - mh - 6, Math.max(6, anchor.y - mh / 2));
    } else {
      leftPos = Math.min(shellW - mw - 6, Math.max(6, anchor.x - mw / 2));
      topPos = Math.max(6, anchor.y - mh - 18);
    }
    axisMenu.style.left = leftPos + 'px';
    axisMenu.style.top = topPos + 'px';
  }

  // Non-overlapping label placement with leader lines
  function placeLabels(items, bounds, mobile) {
    const labelH = mobile ? 11 : 13;
    const padX = mobile ? 4 : 5;
    const padY = mobile ? 2 : 3;
    const estWidth = str => Math.max(40, str.length * (mobile ? 5.0 : 5.75) + 6);

    const cxAll = items.length ? items.reduce((s, it) => s + it.px, 0) / items.length : bounds.midX;
    const cyAll = items.length ? items.reduce((s, it) => s + it.py, 0) / items.length : bounds.midY;

    const ordered = [...items].sort((a, b) => {
      const da = Math.hypot(a.px - cxAll, a.py - cyAll);
      const db = Math.hypot(b.px - cxAll, b.py - cyAll);
      return db - da;
    });

    const angles = [];
    for (let i = 0; i < 24; i++) angles.push((i * Math.PI * 2) / 24);
    const radii = [12, 20, 30, 42, 56, 72, 90, 110, 132, 156, 182, 210, 240];

    const boxes = [];
    const placed = [];

    function overlap(a, b) {
      const ox = Math.max(0, Math.min(a.rx + a.rw + padX, b.rx + b.rw + padX) - Math.max(a.rx - padX, b.rx - padX));
      const oy = Math.max(0, Math.min(a.ry + a.rh + padY, b.ry + b.rh + padY) - Math.max(a.ry - padY, b.ry - padY));
      return ox * oy;
    }

    for (const item of ordered) {
      const w = estWidth(item.m.shortName);
      let best = null;
      let bestScore = Infinity;

      for (const r of radii) {
        for (const ang of angles) {
          const dx = Math.cos(ang) * r;
          const dy = Math.sin(ang) * r;
          let anchor = 'middle';
          if (Math.cos(ang) > 0.25) anchor = 'start';
          else if (Math.cos(ang) < -0.25) anchor = 'end';

          const tx = item.px + dx;
          const ty = item.py + dy + 4;
          let rx = tx;
          if (anchor === 'end') rx = tx - w;
          else if (anchor === 'middle') rx = tx - w / 2;
          const ry = ty - (mobile ? 8.5 : 10);

          if (rx < bounds.left + 4 || rx + w > bounds.right - 4) continue;
          if (ry < bounds.top + 3 || ry + labelH > bounds.bottom - 3) continue;

          const cand = { rx, ry, rw: w, rh: labelH, tx, ty, anchor };
          let penalty = r * 0.55;

          const outDot = dx * (item.px - cxAll) + dy * (item.py - cyAll);
          if (outDot < 0) penalty += 14;

          let hitsDot = false;
          for (const other of items) {
            const nx = Math.max(cand.rx - 5, Math.min(other.px, cand.rx + cand.rw + 5));
            const ny = Math.max(cand.ry - 4, Math.min(other.py, cand.ry + cand.rh + 4));
            const d = Math.hypot(other.px - nx, other.py - ny);
            if (d < 7) {
              penalty += 5000 + (7 - d) * 400;
              hitsDot = true;
            }
          }

          let hitsLabel = false;
          for (const b of boxes) {
            const area = overlap(cand, b);
            if (area > 0) {
              penalty += 10000 + area * 100;
              hitsLabel = true;
            }
          }

          if (penalty < bestScore) {
            bestScore = penalty;
            best = { cand, clean: !hitsDot && !hitsLabel };
          }
        }
        if (best && best.clean && r >= 20) break;
      }

      if (!best) continue;
      if (mobile && !best.clean) continue;
      boxes.push(best.cand);
      placed.push({ item, box: best.cand });
    }

    return placed;
  }

  function showTooltip(m, px, py) {
    const dot = document.getElementById('tip-dot');
    dot.style.background = creatorColor(m.creatorSlug);
    document.getElementById('tip-name').textContent = m.shortName;
    document.getElementById('tip-creator').textContent = m.creatorName;
    document.getElementById('tip-acc').textContent = pct(m.accuracy, 1);
    document.getElementById('tip-hal').textContent = pct(m.hallucinationRate, 1);
    document.getElementById('tip-cost').textContent = fmtCostExact(m.totalCost);
    document.getElementById('tip-brief-elo').textContent = fmtEloExact(m.briefcaseElo);
    document.getElementById('tip-brief-cost').textContent = fmtCostExact(m.briefcaseTotalCost);
    const quadEl = document.getElementById('tip-quad');
    const ySpec = METRICS[state.yMetric];
    const xSpec = METRICS[state.xMetric];
    const paretoSlugs = new Set(computeParetoFrontier(visibleModels(), state.xMetric, state.yMetric).map(x => x.slug));
    const onPareto = state.showPareto && paretoSlugs.has(m.slug);
    const paretoSuffix = onPareto ? ' · Pareto optimal' : '';
    if (isAttractive(m)) {
      quadEl.textContent = `Inside most attractive quadrant (${ySpec.shortTitle} ${ySpec.shortThreshold}, ${xSpec.shortTitle} ${xSpec.shortThreshold})${paretoSuffix}`;
      quadEl.className = 'tip-quad good';
    } else {
      quadEl.textContent = `Outside most attractive quadrant${paretoSuffix}`;
      quadEl.className = 'tip-quad';
    }

    tooltip.classList.add('visible');
    tooltip.setAttribute('aria-hidden', 'false');

    const w = shell.clientWidth;
    const tw = tooltip.offsetWidth;
    const th = tooltip.offsetHeight;
    const left = px + 14 + tw <= w - 4 ? px + 14 : Math.max(4, px - tw - 14);
    const top = py - th - 12 >= 4 ? py - th - 12 : Math.min(shell.clientHeight - th - 4, py + 14);
    tooltip.style.left = left + 'px';
    tooltip.style.top = Math.max(4, top) + 'px';
  }

  function hideTooltip() {
    tooltip.classList.remove('visible');
    tooltip.setAttribute('aria-hidden', 'true');
  }

  let hasAnimatedEntrance = false;

  function attachPointEvents(hit, m, px, py, pointLayer) {
    const enter = () => {
      state.hoveredSlug = m.slug;
      showTooltip(m, px, py);
      updateHighlightStyles(pointLayer);
    };
    const leave = () => {
      if (state.hoveredSlug === m.slug) {
        state.hoveredSlug = null;
        hideTooltip();
        updateHighlightStyles(pointLayer);
      }
    };
    const toggleLock = e => {
      e.stopPropagation();
      state.lockedFamily = state.lockedFamily === m.family ? null : m.family;
      updateStatus();
      renderChart();
      if (state.lockedFamily) showTooltip(m, px, py);
      scheduleUrlSync(true);
    };

    hit.addEventListener('pointerenter', enter);
    hit.addEventListener('pointerleave', leave);
    hit.addEventListener('focus', enter);
    hit.addEventListener('blur', leave);
    hit.addEventListener('click', toggleLock);
    hit.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleLock(e);
      } else if (e.key === 'Escape') {
        state.lockedFamily = null;
        state.hoveredSlug = null;
        hideTooltip();
        updateStatus();
        renderChart();
        scheduleUrlSync(true);
      }
    });
  }

  function updateHighlightStyles(pointLayer) {
    const fam = state.lockedFamily || (state.hoveredSlug ? MODELS.find(x => x.slug === state.hoveredSlug)?.family : null);
    for (const node of pointLayer.querySelectorAll('.plot-point')) {
      const m = node._model;
      const dot = node._dot;
      const ring = node._paretoRing;
      const baseR = node._baseR || 5.5;
      const inFam = !fam || m.family === fam;
      const hov = state.hoveredSlug === m.slug;
      dot.setAttribute('r', String(hov ? baseR + 1.8 : baseR));
      dot.setAttribute('stroke', hov ? '#ffffff' : '#000000');
      dot.setAttribute('stroke-width', hov ? '2' : '1.4');
      dot.setAttribute('opacity', inFam ? '1' : '0.2');
      if (ring) {
        ring.setAttribute('r', String(hov ? baseR + 4.8 : baseR + 3.2));
        ring.setAttribute('stroke-opacity', inFam ? '0.82' : '0.2');
      }
    }
    const paretoPath = plot.querySelector('.pareto-path');
    if (paretoPath) {
      paretoPath.setAttribute('stroke-opacity', fam ? '0.32' : '0.88');
    }
  }

  function renderChart() {
    const xSpec = METRICS[state.xMetric];
    const ySpec = METRICS[state.yMetric];
    const xDom = getAxisDomain('x');
    const yDom = getAxisDomain('y');

    const width = Math.max(300, Math.round(shell.getBoundingClientRect().width));
    const mobile = width < 640;
    const measuredPlotH = Math.round(plot.getBoundingClientRect().height);
    const height = Math.max(260, measuredPlotH > 40 ? measuredPlotH : Math.max(360, Math.round(shell.getBoundingClientRect().height - 36)));
    const margin = {
      left: mobile ? 82 : 94,
      right: 24,
      top: 24,
      bottom: mobile ? 52 : 58
    };
    const left = margin.left;
    const right = width - margin.right;
    const top = margin.top;
    const bottom = height - margin.bottom;
    const plotW = right - left;
    const plotH = bottom - top;

    const X = v => left + mapAxisValue(v, xDom) * plotW;
    const Y = v => bottom - mapAxisValue(v, yDom) * plotH;

    plot.replaceChildren();
    plot.setAttribute('viewBox', `0 0 ${width} ${height}`);
    plot.setAttribute('width', String(width));
    plot.setAttribute('height', String(height));

    const clipId = 'plot-clip-area';
    const defs = svgEl('defs', {}, plot);
    const clip = svgEl('clipPath', { id: clipId }, defs);
    svgEl('rect', { x: left, y: top, width: plotW, height: plotH }, clip);

    const midX = X(xSpec.threshold);
    const midY = Y(ySpec.threshold);
    const quadGroup = svgEl('g', { 'clip-path': `url(#${clipId})` }, plot);

    const clampX = x => Math.max(left, Math.min(right, x));
    const clampY = y => Math.max(top, Math.min(bottom, y));

    // Dynamic "most attractive quadrant" aligned to the better X and better Y corner
    const gx1 = clampX(xSpec.better === 'low' ? left : midX);
    const gx2 = clampX(xSpec.better === 'low' ? midX : right);
    const gy1 = clampY(ySpec.better === 'high' ? top : midY);
    const gy2 = clampY(ySpec.better === 'high' ? midY : bottom);
    const goodW = Math.max(0, gx2 - gx1);
    const goodH = Math.max(0, gy2 - gy1);

    if (goodW > 0 && goodH > 0) {
      svgEl('rect', {
        x: gx1,
        y: gy1,
        width: goodW,
        height: goodH,
        fill: '#4ade80',
        'fill-opacity': '0.13',
        stroke: '#4ade80',
        'stroke-opacity': '0.36',
        'stroke-width': '1',
        class: 'attractive-quadrant'
      }, quadGroup);
    }

    // Opposite (worst) quadrant
    const bx1 = clampX(xSpec.better === 'low' ? midX : left);
    const bx2 = clampX(xSpec.better === 'low' ? right : midX);
    const by1 = clampY(ySpec.better === 'high' ? midY : top);
    const by2 = clampY(ySpec.better === 'high' ? bottom : midY);
    const badW = Math.max(0, bx2 - bx1);
    const badH = Math.max(0, by2 - by1);

    if (badW > 0 && badH > 0) {
      svgEl('rect', {
        x: bx1,
        y: by1,
        width: badW,
        height: badH,
        fill: '#ffffff',
        'fill-opacity': '0.045'
      }, quadGroup);
    }

    if (midX >= left && midX <= right) {
      svgEl('line', {
        x1: midX, y1: top, x2: midX, y2: bottom,
        stroke: 'rgba(255,255,255,0.16)', 'stroke-width': '1', 'stroke-dasharray': '3 4'
      }, quadGroup);
    }
    if (midY >= top && midY <= bottom) {
      svgEl('line', {
        x1: left, y1: midY, x2: right, y2: midY,
        stroke: 'rgba(255,255,255,0.16)', 'stroke-width': '1', 'stroke-dasharray': '3 4'
      }, quadGroup);
    }

    svgEl('line', { x1: left, y1: bottom, x2: right, y2: bottom, stroke: 'rgba(255,255,255,0.22)', 'stroke-width': '1' }, plot);
    svgEl('line', { x1: left, y1: top, x2: left, y2: bottom, stroke: 'rgba(255,255,255,0.22)', 'stroke-width': '1' }, plot);

    const xTickSet = buildAxisTicks(xDom);
    const yTickSet = buildAxisTicks(yDom);

    for (const t of xTickSet.values) {
      const tx = X(t);
      if (tx < left - 1 || tx > right + 1) continue;
      svgEl('line', { x1: tx, y1: bottom, x2: tx, y2: bottom + 5, stroke: 'rgba(255,255,255,0.35)', 'stroke-width': '1' }, plot);
      svgEl('text', {
        x: tx, y: bottom + 18,
        fill: '#9b9ba4', 'font-size': '11', 'text-anchor': 'middle',
        style: 'font-variant-numeric: tabular-nums;'
      }, plot, formatTickValue(xDom.key, t, xTickSet.step));
    }

    for (const t of yTickSet.values) {
      const ty = Y(t);
      if (ty < top - 1 || ty > bottom + 1) continue;
      svgEl('line', { x1: left - 5, y1: ty, x2: left, y2: ty, stroke: 'rgba(255,255,255,0.35)', 'stroke-width': '1' }, plot);
      svgEl('text', {
        x: left - 9, y: ty + 4,
        fill: '#9b9ba4', 'font-size': '11', 'text-anchor': 'end',
        style: 'font-variant-numeric: tabular-nums;'
      }, plot, formatTickValue(yDom.key, t, yTickSet.step));
    }

    function buildAxisTrigger(axis, cx, cy, labelText, rotated) {
      const g = svgEl('g', {
        class: 'axis-title-btn',
        'data-axis': axis,
        role: 'button',
        tabindex: '0',
        'aria-haspopup': 'listbox',
        'aria-expanded': String(state.openAxisMenu === axis && !axisMenu.hidden),
        'aria-label': `Change ${axis.toUpperCase()} axis metric (currently ${labelText})`,
        transform: rotated ? `translate(${cx} ${cy}) rotate(-90)` : `translate(${cx} ${cy})`
      }, plot);

      const bg = svgEl('rect', {
        class: 'axis-title-bg',
        x: -60,
        y: -12,
        width: 120,
        height: 22,
        rx: 5
      }, g);

      const txt = svgEl('text', {
        class: 'axis-title-text',
        x: -6,
        y: 3,
        fill: '#d0d0d7',
        'font-size': '12',
        'font-weight': '500',
        'text-anchor': 'middle'
      }, g, labelText);

      let textLen = labelText.length * 6.5;
      try {
        textLen = txt.getComputedTextLength();
      } catch (_) {}

      const chevX = textLen / 2 - 1;
      svgEl('path', {
        d: `M${chevX} -2.5 L${chevX + 3.5} 1.5 L${chevX + 7} -2.5`,
        fill: 'none',
        stroke: '#9b9ba4',
        'stroke-width': '1.4',
        'stroke-linecap': 'round',
        'stroke-linejoin': 'round',
        'pointer-events': 'none'
      }, g);

      const padW = textLen + 26;
      bg.setAttribute('x', String(-padW / 2));
      bg.setAttribute('width', String(padW));

      const activate = e => {
        e.stopPropagation();
        openAxisMenu(axis, { x: cx, y: cy });
      };
      g.addEventListener('click', activate);
      g.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') {
          e.preventDefault();
          activate(e);
        }
      });
    }

    buildAxisTrigger('x', left + plotW / 2, height - 13, xSpec.axisTitle(), false);

    const yTitleX = mobile ? 32 : 36;
    const yTitleY = top + plotH / 2;
    buildAxisTrigger('y', yTitleX, yTitleY, ySpec.axisTitle(), true);

    const activeList = visibleModels();
    const allItems = activeList.map(m => ({
      m,
      px: X(m[state.xMetric]),
      py: Y(m[state.yMetric])
    }));
    const items = allItems.filter(it =>
      inDomain(it.m[state.xMetric], xDom) && inDomain(it.m[state.yMetric], yDom)
    );

    const focusFamily = state.lockedFamily || (state.hoveredSlug ? MODELS.find(x => x.slug === state.hoveredSlug)?.family : null);

    const paretoFrontier = state.showPareto
      ? computeParetoFrontier(activeList, state.xMetric, state.yMetric)
      : [];
    const paretoSlugs = new Set(paretoFrontier.map(m => m.slug));

    if (state.showPareto && paretoFrontier.length >= 2) {
      const paretoLayer = svgEl('g', { 'clip-path': `url(#${clipId})` }, plot);
      const itemBySlug = new Map(allItems.map(it => [it.m.slug, it]));
      const d = paretoFrontier
        .map((m, idx) => {
          const it = itemBySlug.get(m.slug);
          return `${idx === 0 ? 'M' : 'L'}${it.px.toFixed(1)},${it.py.toFixed(1)}`;
        })
        .join(' ');
      svgEl('path', {
        d,
        fill: 'none',
        stroke: '#fbbf24',
        'stroke-width': '2',
        'stroke-opacity': focusFamily ? '0.32' : '0.88',
        'stroke-linecap': 'round',
        'stroke-linejoin': 'round',
        'pointer-events': 'none',
        class: 'pareto-path'
      }, paretoLayer);
    }

    if (state.showFamilyLines || focusFamily) {
      const byFamily = new Map();
      for (const it of allItems) {
        if (!byFamily.has(it.m.family)) byFamily.set(it.m.family, []);
        byFamily.get(it.m.family).push(it);
      }
      const lineLayer = svgEl('g', { 'clip-path': `url(#${clipId})` }, plot);
      for (const [fam, pts] of byFamily.entries()) {
        if (pts.length < 2) continue;
        if (!state.showFamilyLines && fam !== focusFamily) continue;
        const sorted = [...pts].sort((a, b) => a.m.totalCost - b.m.totalCost);
        const d = sorted.map((p, idx) => `${idx === 0 ? 'M' : 'L'}${p.px.toFixed(1)},${p.py.toFixed(1)}`).join(' ');
        const col = creatorColor(sorted[0].m.creatorSlug);
        svgEl('path', {
          d,
          fill: 'none',
          stroke: col,
          'stroke-width': fam === focusFamily ? '1.8' : '1.1',
          'stroke-opacity': fam === focusFamily ? '0.7' : '0.28',
          'stroke-dasharray': fam === focusFamily ? 'none' : '3 3'
        }, lineLayer);
      }
    }

    const labelLayer = svgEl('g', { class: hasAnimatedEntrance ? '' : 'points-enter' }, plot);
    const pointLayer = svgEl('g', {
      'clip-path': `url(#${clipId})`,
      class: hasAnimatedEntrance ? '' : 'points-enter'
    }, plot);
    hasAnimatedEntrance = true;

    if (state.showLabels) {
      const placedLabels = placeLabels(items, { left, right, top, bottom, midX, midY }, mobile);
      for (const { item, box } of placedLabels) {
        const m = item.m;
        const inFocus = !focusFamily || m.family === focusFamily;
        const isHovered = state.hoveredSlug === m.slug;

        const lx = Math.max(box.rx - 2, Math.min(item.px, box.rx + box.rw + 2));
        const ly = Math.max(box.ry, Math.min(item.py, box.ry + box.rh));
        const dist = Math.hypot(lx - item.px, ly - item.py);
        if (dist > 9) {
          svgEl('line', {
            x1: item.px,
            y1: item.py,
            x2: lx,
            y2: ly,
            stroke: isHovered ? 'rgba(255,255,255,0.65)' : 'rgba(255,255,255,0.26)',
            'stroke-width': '1',
            opacity: inFocus ? '1' : '0.16',
            'pointer-events': 'none'
          }, labelLayer);
        }

        svgEl('text', {
          x: box.tx,
          y: box.ty,
          fill: isHovered ? '#ffffff' : 'rgba(255,255,255,0.84)',
          'font-size': mobile ? '9.5' : '10.8',
          'font-weight': isHovered || (focusFamily && m.family === focusFamily) ? '600' : '400',
          'text-anchor': box.anchor,
          opacity: inFocus ? '1' : '0.16',
          'pointer-events': 'none'
        }, labelLayer, m.shortName);
      }
    }

    for (const item of items) {
      const m = item.m;
      const inFocus = !focusFamily || m.family === focusFamily;
      const isHovered = state.hoveredSlug === m.slug;
      const col = creatorColor(m.creatorSlug);
      const isPareto = state.showPareto && paretoSlugs.has(m.slug);

      const hit = svgEl('circle', {
        cx: item.px,
        cy: item.py,
        r: mobile ? '12' : '10',
        fill: 'transparent',
        tabindex: '0',
        role: 'button',
        'aria-label': `${m.shortName}, ${m.creatorName}, Accuracy ${pct(m.accuracy)}, Hallucination rate ${pct(m.hallucinationRate)}, Total cost ${fmtCostExact(m.totalCost)}, Net score ${m.netScore.toFixed(1)}${isPareto ? ', Pareto optimal' : ''}`,
        class: 'plot-point'
      }, pointLayer);

      let paretoRing = null;
      if (isPareto) {
        paretoRing = svgEl('circle', {
          cx: item.px,
          cy: item.py,
          r: isHovered ? '10.3' : '8.7',
          fill: 'none',
          stroke: '#fbbf24',
          'stroke-width': '1.35',
          'stroke-opacity': inFocus ? '0.82' : '0.2',
          'pointer-events': 'none',
          class: 'pareto-ring'
        }, pointLayer);
      }

      const dot = svgEl('circle', {
        cx: item.px,
        cy: item.py,
        r: isHovered ? '7' : '5.5',
        fill: col,
        stroke: isHovered ? '#ffffff' : '#000000',
        'stroke-width': isHovered ? '2' : '1.5',
        opacity: inFocus ? '1' : '0.2',
        'pointer-events': 'none'
      }, pointLayer);

      hit._dot = dot;
      hit._paretoRing = paretoRing;
      hit._model = m;
      hit._baseR = 5.5;
      attachPointEvents(hit, m, item.px, item.py, pointLayer);
    }

    yZoomBar.style.top = top + 'px';
    yZoomBar.style.height = plotH + 'px';
    xZoomBar.style.marginLeft = Math.max(0, left - 24) + 'px';
    xZoomBar.style.width = plotW + 'px';
    syncZoomSliders();
  }

  function variantLabel(m) {
    const match = m.shortName.match(/\(([^)]+)\)$/);
    if (!match) return m.shortName;
    const raw = match[1];
    return raw.charAt(0).toUpperCase() + raw.slice(1);
  }

  function creatorIconSvg(creatorSlug) {
    if (creatorSlug === 'google') {
      return '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="#38c15c"/></svg>';
    }
    if (creatorSlug === 'anthropic') {
      return '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="#ea7b4f"/></svg>';
    }
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5a4.8 4.8 0 0 1 4.2 2.4 4.8 4.8 0 0 1 4 4.7 4.8 4.8 0 0 1-1.9 3.8 4.8 4.8 0 0 1-2.2 5.4 4.8 4.8 0 0 1-4.1.8 4.8 4.8 0 0 1-4.2-2.4 4.8 4.8 0 0 1-4-4.7 4.8 4.8 0 0 1 1.9-3.8A4.8 4.8 0 0 1 7.9 3.3 4.8 4.8 0 0 1 12 2.5Z"/></svg>';
  }

  function syncCreatorCounts() {
    const oaiTotal = MODELS.filter(m => m.creatorSlug === 'openai').length;
    const oaiSel = MODELS.filter(m => m.creatorSlug === 'openai' && state.selectedSlugs.has(m.slug)).length;
    const gogTotal = MODELS.filter(m => m.creatorSlug === 'google').length;
    const gogSel = MODELS.filter(m => m.creatorSlug === 'google' && state.selectedSlugs.has(m.slug)).length;
    const antTotal = MODELS.filter(m => m.creatorSlug === 'anthropic').length;
    const antSel = MODELS.filter(m => m.creatorSlug === 'anthropic' && state.selectedSlugs.has(m.slug)).length;
    countOpenai.textContent = oaiSel === oaiTotal ? `(${oaiTotal})` : `(${oaiSel}/${oaiTotal})`;
    countGoogle.textContent = gogSel === gogTotal ? `(${gogTotal})` : `(${gogSel}/${gogTotal})`;
    countAnthropic.textContent = antSel === antTotal ? `(${antTotal})` : `(${antSel}/${antTotal})`;
    modelTriggerLabel.textContent = `Models (${state.selectedSlugs.size}/${MODELS.length})`;
  }

  function renderModelPicker() {
    const q = state.modelSearch.trim().toLowerCase();
    const groups = [];
    const byFamily = new Map();

    for (const m of MODELS) {
      if (!byFamily.has(m.family)) {
        const g = { family: m.family, creatorSlug: m.creatorSlug, creatorName: m.creatorName, models: [] };
        byFamily.set(m.family, g);
        groups.push(g);
      }
      byFamily.get(m.family).models.push(m);
    }

    const prevScroll = modelList.scrollTop;
    modelList.replaceChildren();
    let shownGroups = 0;

    for (const g of groups) {
      const famMatches = !q || g.family.toLowerCase().includes(q) || g.creatorName.toLowerCase().includes(q);
      const matchingModels = famMatches
        ? g.models
        : g.models.filter(m => m.shortName.toLowerCase().includes(q) || variantLabel(m).toLowerCase().includes(q));

      if (!matchingModels.length) continue;
      shownGroups++;

      const famSelectedCount = g.models.filter(m => state.selectedSlugs.has(m.slug)).length;
      const allFamSelected = famSelectedCount === g.models.length;

      const famWrap = document.createElement('div');
      famWrap.className = 'mp-family';

      const famBtn = document.createElement('button');
      famBtn.type = 'button';
      famBtn.className = 'mp-family-btn' + (famSelectedCount === 0 ? ' is-empty' : '');
      famBtn.setAttribute('aria-pressed', String(allFamSelected));
      famBtn.innerHTML = `
        <span class="mp-fam-left">
          <span class="mp-creator-icon">${creatorIconSvg(g.creatorSlug)}</span>
          <span>${g.family}</span>
        </span>
        <span class="mp-fam-count">${famSelectedCount}/${g.models.length}</span>
      `;
      famBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (allFamSelected) {
          for (const m of g.models) state.selectedSlugs.delete(m.slug);
        } else {
          for (const m of g.models) state.selectedSlugs.add(m.slug);
        }
        onModelSelectionChange();
      });
      famWrap.appendChild(famBtn);

      const varWrap = document.createElement('div');
      varWrap.className = 'mp-variants';

      for (const m of matchingModels) {
        const active = state.selectedSlugs.has(m.slug);
        const vBtn = document.createElement('button');
        vBtn.type = 'button';
        vBtn.className = 'mp-variant-btn';
        vBtn.setAttribute('aria-pressed', String(active));

        const lbl = document.createElement('span');
        lbl.textContent = variantLabel(m);

        const dot = document.createElement('span');
        dot.className = 'mp-dot';
        dot.style.background = creatorColor(m.creatorSlug);

        vBtn.appendChild(lbl);
        vBtn.appendChild(dot);
        vBtn.addEventListener('click', e => {
          e.stopPropagation();
          if (state.selectedSlugs.has(m.slug)) {
            state.selectedSlugs.delete(m.slug);
          } else {
            state.selectedSlugs.add(m.slug);
          }
          onModelSelectionChange();
        });
        varWrap.appendChild(vBtn);
      }

      famWrap.appendChild(varWrap);
      modelList.appendChild(famWrap);
    }

    if (!shownGroups) {
      const empty = document.createElement('div');
      empty.className = 'mp-empty';
      empty.textContent = 'No models match that search.';
      modelList.appendChild(empty);
    }

    modelList.scrollTop = prevScroll;
    syncCreatorCounts();
  }

  function setMpNote(msg) {
    mpNote.textContent = msg || '';
  }

  function onModelSelectionChange() {
    if (state.lockedFamily && !visibleModels().some(m => m.family === state.lockedFamily)) {
      state.lockedFamily = null;
    }
    if (state.zoomToData) {
      applyZoomToData();
    }
    syncZoomButton();
    setMpNote('');
    hideTooltip();
    renderModelPicker();
    updateStatus();
    renderChart();
    scheduleUrlSync(true);
  }

  function setPopoverOpen(open) {
    modelPopover.hidden = !open;
    modelTrigger.setAttribute('aria-expanded', String(open));
    modelTrigger.setAttribute('aria-pressed', String(open));
    if (open) {
      modelPopover.style.left = '0';
      modelPopover.style.right = 'auto';
      const rect = modelPopover.getBoundingClientRect();
      if (rect.right > window.innerWidth - 16) {
        modelPopover.style.left = 'auto';
        modelPopover.style.right = '0';
        const rect2 = modelPopover.getBoundingClientRect();
        if (rect2.left < 16) {
          modelPopover.style.right = (rect2.left - 16) + 'px';
        }
      }
      renderModelPicker();
      setMpNote('');
      modelSearchInput.focus();
    }
  }

  function updateStatus() {
    if (state.lockedFamily) {
      lockPill.hidden = false;
      lockPill.textContent = `Locked: ${state.lockedFamily} ×`;
      lockPill.title = 'Click to unlock model family';
    } else {
      lockPill.hidden = true;
      lockPill.textContent = '';
    }
  }

  function setAxisNormRange(axis, nMin, nMax, immediate = false) {
    const clampedMin = Math.max(0, Math.min(1 - MIN_NORM_GAP, nMin));
    const clampedMax = Math.min(1, Math.max(clampedMin + MIN_NORM_GAP, nMax));
    const zoomed = clampedMin > 0.002 || clampedMax < 0.998;
    const next = zoomed ? [clampedMin, clampedMax] : [0, 1];
    state.zoomToData = false;
    if (axis === 'x') state.xRange = next;
    else state.yRange = next;
    syncZoomButton();
    hideTooltip();
    updateStatus();
    renderChart();
    scheduleUrlSync(immediate);
  }

  function buildZoomSlider(bar, axis) {
    const isVert = axis === 'y';

    const track = document.createElement('div');
    track.className = 'aa-zoom-track';

    const range = document.createElement('div');
    range.className = 'aa-zoom-range';

    const thumbMin = document.createElement('div');
    thumbMin.className = 'aa-zoom-thumb aa-zoom-thumb--min';
    thumbMin.tabIndex = 0;
    thumbMin.setAttribute('role', 'slider');
    thumbMin.setAttribute('aria-orientation', isVert ? 'vertical' : 'horizontal');
    thumbMin.setAttribute('aria-label', `${isVert ? 'Y' : 'X'} axis minimum zoom`);
    thumbMin.setAttribute('aria-valuemin', '0');
    thumbMin.setAttribute('aria-valuemax', '100');
    const tipMin = document.createElement('div');
    tipMin.className = 'aa-zoom-tip';
    thumbMin.appendChild(tipMin);

    const thumbMax = document.createElement('div');
    thumbMax.className = 'aa-zoom-thumb aa-zoom-thumb--max';
    thumbMax.tabIndex = 0;
    thumbMax.setAttribute('role', 'slider');
    thumbMax.setAttribute('aria-orientation', isVert ? 'vertical' : 'horizontal');
    thumbMax.setAttribute('aria-label', `${isVert ? 'Y' : 'X'} axis maximum zoom`);
    thumbMax.setAttribute('aria-valuemin', '0');
    thumbMax.setAttribute('aria-valuemax', '100');
    const tipMax = document.createElement('div');
    tipMax.className = 'aa-zoom-tip';
    thumbMax.appendChild(tipMax);

    const edgeMin = document.createElement('div');
    edgeMin.className = 'aa-zoom-edge-label aa-zoom-edge-label--min';
    const edgeMax = document.createElement('div');
    edgeMax.className = 'aa-zoom-edge-label aa-zoom-edge-label--max';

    const resetBtn = document.createElement('button');
    resetBtn.type = 'button';
    resetBtn.className = 'aa-zoom-reset';
    resetBtn.textContent = '\u21BA';
    resetBtn.title = `Reset ${isVert ? 'Y' : 'X'} axis scale`;
    resetBtn.setAttribute('aria-label', `Reset ${isVert ? 'Y' : 'X'} axis scale`);
    resetBtn.addEventListener('click', e => {
      e.stopPropagation();
      setAxisNormRange(axis, 0, 1, true);
    });

    track.appendChild(range);
    track.appendChild(thumbMin);
    track.appendChild(thumbMax);
    bar.replaceChildren(track, edgeMin, edgeMax, resetBtn);

    function currentRange() {
      return axis === 'x' ? state.xRange : state.yRange;
    }

    function positionFromEvent(e) {
      const rect = track.getBoundingClientRect();
      if (isVert) {
        return Math.max(0, Math.min(1, (rect.bottom - e.clientY) / Math.max(1, rect.height)));
      }
      return Math.max(0, Math.min(1, (e.clientX - rect.left) / Math.max(1, rect.width)));
    }

    function startDrag(mode, e) {
      e.preventDefault();
      e.stopPropagation();
      bar.classList.add('is-dragging');
      if (mode === 'min') thumbMin.classList.add('is-active');
      if (mode === 'max') thumbMax.classList.add('is-active');

      const startT = positionFromEvent(e);
      const [startMinN, startMaxN] = currentRange();
      const targetEl = e.currentTarget;
      try {
        targetEl.setPointerCapture(e.pointerId);
      } catch (_) {}

      const onMove = ev => {
        const t = positionFromEvent(ev);
        const [curMinN, curMaxN] = currentRange();
        if (mode === 'min') {
          const nextMin = Math.max(0, Math.min(curMaxN - MIN_NORM_GAP, t));
          setAxisNormRange(axis, nextMin, curMaxN);
        } else if (mode === 'max') {
          const nextMax = Math.min(1, Math.max(curMinN + MIN_NORM_GAP, t));
          setAxisNormRange(axis, curMinN, nextMax);
        } else if (mode === 'range') {
          const span = startMaxN - startMinN;
          let delta = t - startT;
          if (startMinN + delta < 0) delta = -startMinN;
          if (startMaxN + delta > 1) delta = 1 - startMaxN;
          setAxisNormRange(axis, startMinN + delta, startMinN + delta + span);
        }
      };

      const onUp = ev => {
        bar.classList.remove('is-dragging');
        thumbMin.classList.remove('is-active');
        thumbMax.classList.remove('is-active');
        try {
          targetEl.releasePointerCapture(ev.pointerId);
        } catch (_) {}
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        scheduleUrlSync(true);
      };

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    }

    function onThumbKey(mode, e) {
      const step = e.shiftKey ? 0.1 : 0.025;
      const [curMinN, curMaxN] = currentRange();
      let delta = 0;
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') delta = step;
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') delta = -step;
      else if (e.key === 'Home') {
        e.preventDefault();
        if (mode === 'min') setAxisNormRange(axis, 0, curMaxN, true);
        else setAxisNormRange(axis, curMinN, curMinN + MIN_NORM_GAP, true);
        return;
      } else if (e.key === 'End') {
        e.preventDefault();
        if (mode === 'min') setAxisNormRange(axis, curMaxN - MIN_NORM_GAP, curMaxN, true);
        else setAxisNormRange(axis, curMinN, 1, true);
        return;
      } else {
        return;
      }
      e.preventDefault();
      if (mode === 'min') {
        setAxisNormRange(axis, Math.max(0, Math.min(curMaxN - MIN_NORM_GAP, curMinN + delta)), curMaxN, true);
      } else {
        setAxisNormRange(axis, curMinN, Math.min(1, Math.max(curMinN + MIN_NORM_GAP, curMaxN + delta)), true);
      }
    }

    thumbMin.addEventListener('pointerdown', e => startDrag('min', e));
    thumbMax.addEventListener('pointerdown', e => startDrag('max', e));
    range.addEventListener('pointerdown', e => startDrag('range', e));
    thumbMin.addEventListener('keydown', e => onThumbKey('min', e));
    thumbMax.addEventListener('keydown', e => onThumbKey('max', e));

    track.addEventListener('pointerdown', e => {
      if (e.target !== track) return;
      const t = positionFromEvent(e);
      const [curMinN, curMaxN] = currentRange();
      const dMin = Math.abs(t - curMinN);
      const dMax = Math.abs(t - curMaxN);
      if (dMin <= dMax) {
        setAxisNormRange(axis, Math.min(t, curMaxN - MIN_NORM_GAP), curMaxN);
        startDrag('min', e);
      } else {
        setAxisNormRange(axis, curMinN, Math.max(t, curMinN + MIN_NORM_GAP));
        startDrag('max', e);
      }
    });

    track.addEventListener('dblclick', e => {
      e.stopPropagation();
      setAxisNormRange(axis, 0, 1, true);
    });

    return {
      update() {
        const dom = getAxisDomain(axis);
        const span = Math.abs(dom.max - dom.min);
        const minLabel = formatZoomReadout(dom.key, dom.min, span);
        const maxLabel = formatZoomReadout(dom.key, dom.max, span);

        bar.classList.toggle('is-zoomed', dom.isZoomed);
        if (isVert) {
          const minTopPct = (1 - dom.normMin) * 100;
          const maxTopPct = (1 - dom.normMax) * 100;
          thumbMin.style.top = minTopPct + '%';
          thumbMax.style.top = maxTopPct + '%';
          range.style.top = maxTopPct + '%';
          range.style.height = Math.max(0, minTopPct - maxTopPct) + '%';
        } else {
          const minLeftPct = dom.normMin * 100;
          const maxLeftPct = dom.normMax * 100;
          thumbMin.style.left = minLeftPct + '%';
          thumbMax.style.left = maxLeftPct + '%';
          range.style.left = minLeftPct + '%';
          range.style.width = Math.max(0, maxLeftPct - minLeftPct) + '%';
        }

        tipMin.textContent = minLabel;
        tipMax.textContent = maxLabel;
        edgeMin.textContent = minLabel;
        edgeMax.textContent = maxLabel;
        thumbMin.setAttribute('aria-valuenow', String(Math.round(dom.normMin * 100)));
        thumbMin.setAttribute('aria-valuetext', minLabel);
        thumbMax.setAttribute('aria-valuenow', String(Math.round(dom.normMax * 100)));
        thumbMax.setAttribute('aria-valuetext', maxLabel);
      }
    };
  }

  const ySlider = buildZoomSlider(yZoomBar, 'y');
  const xSlider = buildZoomSlider(xZoomBar, 'x');

  function syncZoomSliders() {
    ySlider.update();
    xSlider.update();
  }

  function applyAxisChange() {
    if (state.zoomToData) {
      applyZoomToData();
    }
    hideTooltip();
    syncAxisCopy();
    updateStatus();
    renderChart();
    scheduleUrlSync(true);
  }

  swapAxesBtn.addEventListener('click', () => {
    closeAxisMenu();
    const prevY = state.yMetric;
    state.yMetric = state.xMetric;
    state.xMetric = prevY;
    const prevRange = state.yRange;
    state.yRange = state.xRange;
    state.xRange = prevRange;
    applyAxisChange();
  });

  costScaleBtn.addEventListener('click', () => {
    state.costScale = state.costScale === 'log' ? 'linear' : 'log';
    costScaleBtn.setAttribute('aria-pressed', String(state.costScale === 'log'));
    costScaleBtn.textContent = state.costScale === 'log' ? 'Cost scale: Log' : 'Cost scale: Linear';
    costScaleBtn.title = costScaleBtn.textContent;
    if (state.zoomToData) {
      applyZoomToData();
    } else {
      if (isCostMetric(state.xMetric)) state.xRange = [0, 1];
      if (isCostMetric(state.yMetric)) state.yRange = [0, 1];
    }
    syncZoomButton();
    hideTooltip();
    updateStatus();
    renderChart();
    scheduleUrlSync(true);
  });

  modelTrigger.addEventListener('click', e => {
    e.stopPropagation();
    closeAxisMenu();
    setPopoverOpen(modelPopover.hidden);
  });

  modelPopover.addEventListener('click', e => {
    e.stopPropagation();
  });

  modelSearchInput.addEventListener('input', () => {
    state.modelSearch = modelSearchInput.value;
    renderModelPicker();
  });

  mpClearBtn.addEventListener('click', () => {
    state.selectedSlugs.clear();
    onModelSelectionChange();
  });

  mpSelectAllBtn.addEventListener('click', () => {
    state.selectedSlugs = new Set(MODELS.map(m => m.slug));
    state.creators = new Set(ALL_CREATORS);
    creatorBtns.forEach(b => b.setAttribute('aria-pressed', 'true'));
    onModelSelectionChange();
  });

  mpResetBtn.addEventListener('click', () => {
    state.selectedSlugs = new Set(MODELS.map(m => m.slug));
    state.creators = new Set(ALL_CREATORS);
    state.modelSearch = '';
    modelSearchInput.value = '';
    creatorBtns.forEach(b => b.setAttribute('aria-pressed', 'true'));
    onModelSelectionChange();
    setMpNote(`Reset to all ${MODELS.length} default models.`);
  });

  mpSaveBtn.addEventListener('click', () => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...state.selectedSlugs]));
      setMpNote(`Saved ${state.selectedSlugs.size} models.`);
    } catch {
      setMpNote('Browser storage is unavailable here.');
    }
  });

  mpLoadBtn.addEventListener('click', () => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        setMpNote('No saved selection found.');
        return;
      }
      const parsed = JSON.parse(raw);
      const valid = new Set(MODELS.map(m => m.slug));
      state.selectedSlugs = new Set(Array.isArray(parsed) ? parsed.filter(s => valid.has(s)) : []);
      onModelSelectionChange();
      setMpNote(`Loaded ${state.selectedSlugs.size} saved models.`);
    } catch {
      setMpNote('Could not read saved selection.');
    }
  });

  document.addEventListener('click', e => {
    if (!modelPopover.hidden && !modelPicker.contains(e.target)) {
      setPopoverOpen(false);
    }
    if (!axisMenu.hidden && !axisMenu.contains(e.target)) {
      closeAxisMenu();
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!axisMenu.hidden) {
        const lastAxis = state.openAxisMenu;
        closeAxisMenu();
        const trigger = plot.querySelector(`.axis-title-btn[data-axis="${lastAxis}"]`);
        if (trigger) trigger.focus();
      } else if (!modelPopover.hidden) {
        setPopoverOpen(false);
        modelTrigger.focus();
      }
    }
  });

  labelsBtn.addEventListener('click', () => {
    state.showLabels = !state.showLabels;
    labelsBtn.setAttribute('aria-pressed', String(!state.showLabels));
    labelsBtn.textContent = state.showLabels ? 'Hide model names' : 'Model names hidden';
    labelsBtn.title = labelsBtn.textContent;
    fitToolbarButtons();
    renderChart();
    scheduleUrlSync(true);
  });

  zoomBtn.addEventListener('click', () => {
    if (state.zoomToData || isAnyZoomed()) {
      state.zoomToData = false;
      state.xRange = [0, 1];
      state.yRange = [0, 1];
    } else {
      state.zoomToData = true;
      applyZoomToData();
    }
    syncAxisCopy();
    hideTooltip();
    updateStatus();
    renderChart();
    scheduleUrlSync(true);
  });

  linesBtn.addEventListener('click', () => {
    state.showFamilyLines = !state.showFamilyLines;
    linesBtn.setAttribute('aria-pressed', String(state.showFamilyLines));
    renderChart();
    scheduleUrlSync(true);
  });

  lockPill.addEventListener('click', () => {
    state.lockedFamily = null;
    hideTooltip();
    updateStatus();
    renderChart();
    scheduleUrlSync(true);
  });

  creatorBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const c = btn.dataset.creator;
      if (state.creators.has(c) && state.creators.size > 1) {
        state.creators.delete(c);
      } else if (state.creators.has(c)) {
        for (const cr of ALL_CREATORS) state.creators.add(cr);
      } else {
        state.creators.add(c);
      }
      creatorBtns.forEach(b => b.setAttribute('aria-pressed', String(state.creators.has(b.dataset.creator))));
      state.lockedFamily = null;
      if (state.zoomToData) {
        applyZoomToData();
      }
      syncZoomButton();
      hideTooltip();
      updateStatus();
      renderChart();
      scheduleUrlSync(true);
    });
  });

  plot.addEventListener('click', e => {
    if (e.target === plot && state.lockedFamily) {
      state.lockedFamily = null;
      hideTooltip();
      updateStatus();
      renderChart();
      scheduleUrlSync(true);
    }
  });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      closeAxisMenu();
      hideTooltip();
      fitToolbarButtons();
      renderChart();
    }, 90);
  });

  applyUrlState();
  syncControlsFromState();
  if (state.zoomToData) {
    applyZoomToData();
  }
  syncAxisCopy();
  syncCreatorCounts();
  updateStatus();
  fitToolbarButtons();
  renderChart();
})();
</script>
</body>
</html>
