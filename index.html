<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="An automatically updated index of the projects, websites, and tools published by Alazen.">
  <title>Alazen | Projects</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #000; color: #f2f2f2; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; }
    a { color: inherit; }
    a:focus-visible, input:focus-visible { outline: 2px solid #fafafa; outline-offset: 5px; }
    /* Decorative canvas sits behind all clickable content; the page stays solid black. */
    #ambient-background { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 0; }
    .shell { position: relative; z-index: 1; }
    .shell { width: min(100% - 64px, 1040px); margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: center; padding-top: 42px; gap: 24px; }
    .signature { text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: -.035em; }
    .source { text-decoration: none; color: #a1a1a1; font-size: 13px; transition: color .2s; }
    .source:hover { color: #fff; }
    main { padding-top: 80px; padding-bottom: 180px; }
    .controls { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-top: 0; }
    .search { background: transparent; border: 0; border-bottom: 1px solid #3a3a3a; border-radius: 0; padding: 14px 0; min-width: 0; width: min(100%, 400px); color: #fff; font: inherit; font-size: 17px; transition: border-color .2s; appearance: none; }
    .search:focus { border-color: #fff; outline: 0; }
    .search::placeholder { color: #777; }
    .count { white-space: nowrap; font-size: 13px; color: #838383; padding-bottom: 14px; }
    .entries { list-style: none; margin: 38px 0 0; padding: 0; }
    .entry { margin: 0; }
    .entry a { display: grid; grid-template-columns: 40px minmax(0, 1fr) 24px; gap: 18px; align-items: baseline; padding: 24px 0; text-decoration: none; transition: color .2s, transform .2s; }
    .entry a:hover { color: #b8b8b8; transform: translateX(4px); }
    .number, .arrow { color: #777; font-size: 14px; font-weight: 400; }
    .arrow { text-align: right; font-size: 20px; }
    .entry-title { font-size: clamp(20px, 3.5vw, 37px); line-height: 1.3; font-weight: 460; letter-spacing: -.04em; overflow-wrap: anywhere; }
    .empty { padding: 38px 0; color: #999; line-height: 1.6; }
    .status { margin: 64px 0 0; color: #777; font-size: 12px; line-height: 1.7; }
    .status a { text-underline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 640px) {
      .shell { width: min(100% - 40px, 1040px); }
      .top { padding-top: 26px; }
      main { padding-top: 64px; padding-bottom: 100px; }
      .controls { align-items: stretch; flex-direction: column; gap: 8px; }
      .search { width: 100%; }
      .count { padding: 0; }
      .entries { margin-top: 20px; }
      .entry a { grid-template-columns: 26px minmax(0,1fr) 20px; gap: 12px; padding: 22px 0; }
      .number { font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <canvas id="ambient-background" aria-hidden="true"></canvas>
  <div class="shell">
    <header class="top">
      <a href="/" class="signature" aria-label="Alazen homepage">Alazen</a>
      <a class="source" href="https://github.com/Alazen/alazen.github.io" target="_blank" rel="noopener noreferrer">View on GitHub ↗</a>
    </header>
    <main>
      <div class="controls">
        <label class="sr-only" for="filter">Search projects</label>
        <input id="filter" class="search" type="search" placeholder="Find a project..." autocomplete="off" spellcheck="false">
        <div id="count" class="count" role="status" aria-live="polite">2 projects</div>
      </div>
      <nav aria-label="Published projects">
        <ol id="entries" class="entries">
          <li class="entry"><a href="/aniimo-break-atlas-4-argon-high-43m00s/"><span class="number">01</span><span class="entry-title">Aniimo Break Atlas 4 Argon High 43m00s</span><span class="arrow" aria-hidden="true">↗</span></a></li>
          <li class="entry"><a href="/aniimo-break-atlas-6.1-sol-max-40m01s-30.1-percent/"><span class="number">02</span><span class="entry-title">Aniimo Break Atlas 6.1 Sol Max 40m01s 30.1 Percent</span><span class="arrow" aria-hidden="true">↗</span></a></li>
        </ol>
      </nav>
      <p id="status" class="status" role="status" aria-live="polite" hidden></p>
      <noscript><p class="status">Enable JavaScript to discover newly added folders automatically. Existing links above remain available.</p></noscript>
    </main>
  </div>
  <script>
    (() => {
      "use strict";
      const api = "https://api.github.com/repos/Alazen/alazen.github.io/git/trees/main?recursive=1";
      const cacheKey = "alazen-project-directory-v1";
      const knownPaths = [
        "aniimo-break-atlas-4-argon-high-43m00s",
        "aniimo-break-atlas-6.1-sol-max-40m01s-30.1-percent"
      ];
      const list = document.getElementById("entries");
      const input = document.getElementById("filter");
      const count = document.getElementById("count");
      const status = document.getElementById("status");
      let paths = knownPaths;

      function label(segment) {
        return segment.replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim()
          .replace(/\b[a-z]/g, letter => letter.toUpperCase());
      }

      function projectUrl(path) {
        return "/" + path.split("/").map(encodeURIComponent).join("/") + "/";
      }

      function render() {
        const query = input.value.trim().toLocaleLowerCase();
        const matches = paths.filter(path => path.toLocaleLowerCase().includes(query) ||
          path.split("/").map(label).join(" ").toLocaleLowerCase().includes(query));
        const fragment = document.createDocumentFragment();
        matches.forEach((path, i) => {
          const item = document.createElement("li");
          item.className = "entry";
          const link = document.createElement("a");
          link.href = projectUrl(path);
          const number = document.createElement("span");
          number.className = "number";
          number.textContent = String(i + 1).padStart(2, "0");
          const title = document.createElement("span");
          title.className = "entry-title";
          title.textContent = path.split("/").map(label).join(" / ");
          const arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.setAttribute("aria-hidden", "true");
          arrow.textContent = "↗";
          link.append(number, title, arrow);
          item.append(link);
          fragment.append(item);
        });
        if (!matches.length) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = "No projects match your search.";
          fragment.append(empty);
        }
        list.replaceChildren(fragment);
        count.textContent = query
          ? matches.length + " of " + paths.length + " projects"
          : paths.length + (paths.length === 1 ? " project" : " projects");
      }

      function readCache() {
        try {
          const cached = JSON.parse(localStorage.getItem(cacheKey) || "null");
          if (Array.isArray(cached) && cached.every(path => typeof path === "string")) return cached;
        } catch (_) {}
        return null;
      }

      const cached = readCache();
      if (cached) paths = cached;
      render();
      input.addEventListener("input", render);

      async function refresh() {
        try {
          const response = await fetch(api, {
            headers: { "Accept": "application/vnd.github+json" },
            cache: "no-store",
            credentials: "omit"
          });
          if (!response.ok) throw new Error("GitHub API returned " + response.status);
          const result = await response.json();
          if (!Array.isArray(result.tree) || result.truncated) throw new Error("Incomplete directory listing");
          const discovered = result.tree
            .filter(entry => entry.type === "blob" && entry.path.endsWith("/index.html"))
            .map(entry => entry.path.slice(0, -"/index.html".length))
            .filter(path => path.split("/").every(part => part && !part.startsWith(".")))
            .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" }));
          paths = [...new Set(discovered)];
          try { localStorage.setItem(cacheKey, JSON.stringify(paths)); } catch (_) {}
          render();
          status.textContent = "";
          status.hidden = true;
        } catch (_) {
          status.hidden = false;
          status.textContent = "GitHub directory lookup is temporarily unavailable. Showing saved links. Browse all files on GitHub: ";
          const link = document.createElement("a");
          link.href = "https://github.com/Alazen/alazen.github.io/tree/main";
          link.textContent = "View repository ↗";
          status.append(link);
        }
      }

      refresh();
    })();
  </script>
  <script>
    /*
     * Adapted from "Animated Background" by Marco Guglielmelli:
     * https://codepen.io/MarcoGuglielmelli/pen/ExGYae
     *
     * MIT License. Copyright (c) 2026 Marco Guglielmelli.

     * in all copies or substantial portions of the Software.

     * OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF
     * MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT.

     * CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT,
     * TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE
     * SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.
     */
    (() => {
      "use strict";
      const canvas = document.getElementById("ambient-background");
      const ctx = canvas && canvas.getContext("2d", { alpha: true });
      if (!ctx) return;
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const finePointer = window.matchMedia("(pointer: fine)").matches;
      let width = 0, height = 0, particles = [], edges = [];
      let target = { x: 0, y: 0 }, lastFrame = 0, frameHandle = 0;
      let pointerMoved = false;

      function squaredDistance(a, b) {
        const dx = a.x - b.x, dy = a.y - b.y;
        return dx * dx + dy * dy;
      }

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        if (!pointerMoved) target = { x: width / 2, y: height / 2 };

        const cols = Math.max(7, Math.min(19, Math.round(width / 85)));
        const rows = Math.max(7, Math.min(13, Math.round(height / 85)));
        particles = [];
        const grid = Array.from({ length: rows }, () => []);
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const originX = ((col + 0.5 + (Math.random() - 0.5) * 0.65) / cols) * width;
            const originY = ((row + 0.5 + (Math.random() - 0.5) * 0.65) / rows) * height;
            const p = {
              x: originX, y: originY, originX, originY,
              phase: Math.random() * Math.PI * 2,
              speed: 0.65 + Math.random() * 0.7,
              radius: 1.1 + Math.random() * 1.3,
              intensity: 0
            };
            grid[row][col] = p;
            particles.push(p);
          }
        }

        const seen = new Set();
        edges = [];
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const p = grid[row][col];
            const neighbors = [];
            for (let dy = -1; dy <= 1; dy++) {
              for (let dx = -1; dx <= 1; dx++) {
                if (!dx && !dy) continue;
                const q = grid[row + dy]?.[col + dx];
                if (q) neighbors.push(q);
              }
            }
            neighbors.sort((a, b) => squaredDistance(p, a) - squaredDistance(p, b));
            for (const q of neighbors.slice(0, 5)) {
              const a = particles.indexOf(p), b = particles.indexOf(q);
              const key = Math.min(a, b) + ":" + Math.max(a, b);
              if (seen.has(key)) continue;
              seen.add(key);
              edges.push([p, q]);
            }
          }
        }
        render(performance.now());
      }

      function render(time) {
        ctx.clearRect(0, 0, width, height);
        const t = time / 1600;
        const reach = Math.max(220, Math.min(440, Math.min(width, height) * 0.62));
        const reachSq = reach * reach;
        for (const p of particles) {
          if (!reduceMotion) {
            p.x = p.originX + Math.sin(t * p.speed + p.phase) * 24;
            p.y = p.originY + Math.cos(t * p.speed * 0.8 + p.phase) * 24;
          }
          const distanceSq = squaredDistance(target, p);
          p.intensity = distanceSq < reachSq
            ? Math.pow(1 - Math.sqrt(distanceSq) / reach, 1.25)
            : 0;
        }

        ctx.strokeStyle = "#9cd9f9";
        ctx.lineWidth = 0.75;
        for (const [p, q] of edges) {
          const intensity = Math.max(p.intensity, q.intensity);
          if (intensity < 0.015) continue;
          ctx.globalAlpha = intensity * 0.30;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.stroke();
        }
        ctx.fillStyle = "#9cd9f9";
        for (const p of particles) {
          if (p.intensity < 0.015) continue;
          ctx.globalAlpha = p.intensity * 0.55;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function frame(now) {
        frameHandle = 0;
        if (document.hidden || reduceMotion) return;
        if (now - lastFrame >= 1000 / 30) {
          render(now);
          lastFrame = now;
        }
        frameHandle = requestAnimationFrame(frame);
      }

      function restart() {
        if (!document.hidden && !reduceMotion && !frameHandle) {
          lastFrame = 0;
          frameHandle = requestAnimationFrame(frame);
        }
      }

      if (finePointer && !reduceMotion) {
        window.addEventListener("pointermove", event => {
          if (event.pointerType === "mouse" || event.pointerType === "pen") {
            target.x = event.clientX;
            target.y = event.clientY;
            pointerMoved = true;
          }
        }, { passive: true });
      }

      window.addEventListener("resize", resize, { passive: true });
      document.addEventListener("visibilitychange", restart);
      resize();
      restart();
    })();
  </script>
</body>
</html>
