 if(S.summary||S.config>=4){renderSummary();return}
 const m=currentMap();S.step=Math.max(1,Math.min(S.step,m.nodes.length));const n=m.nodes[S.step-1];
 view.innerHTML=`<div class="board-layout"><section class="board-main"><div class="board-heading"><div><h1>${D.boards[S.board].name}</h1><p>${cfg().label.replace(' · ',' / ')} points</p></div><div class="board-count"><strong>${m.points}</strong><span>board points</span></div></div><div class="map-wrap">${drawMap(S.board,m.nodes,S.step,true)}</div>${legend()}</section><aside class="detail" aria-label="Selected purchase"><div class="step">${S.step}<small>of ${m.nodes.length}</small></div><p class="kind" style="color:${colors[n.type]}">${n.type==='stat'?'Stat node':n.type==='corner'?'Corner node':n.type==='active'?'Active skill':'Passive skill'}</p><h2>${E(n.name)}</h2><div class="metrics">${n.cost?`<div class="metric"><strong>${n.cost}</strong><span>cost</span></div><div class="metric"><strong>${n.spent}</strong><span>spent</span></div>`:`<div class="metric"><strong>40</strong><span>total points</span></div>`}</div><p class="direction">${directions(n.x,n.y)}</p><p class="coordinate">Row ${n.y+8}, column ${n.x+8}</p><p class="note">${S.board===4?'Azphel uses its own crystals. The source does not list individual node costs.':'Numbers show purchase order. Dim nodes come later. Choose a node or move through the sequence.'}</p><div class="stepper"><button id="prev" ${S.step===1?'disabled':''}>Previous</button><input id="cursor" type="range" min="1" max="${m.nodes.length}" value="${S.step}" aria-label="Purchase step" aria-valuetext="Step ${S.step}: ${E(n.name)}"><button id="next" ${S.step===m.nodes.length?'disabled':''}>Next</button></div></aside></div>`;
 $('#prev').onclick=()=>changeStep(S.step-1,'prev');$('#next').onclick=()=>changeStep(S.step+1,'next');
 $('#cursor').oninput=e=>changeStep(+e.target.value,'cursor');
 view.querySelectorAll('[data-node]').forEach(el=>{el.onclick=()=>changeStep(+el.dataset.node);el.onkeydown=e=>{let next;if(e.key==='Enter'||e.key===' '){e.preventDefault();changeStep(+el.dataset.node,'node');return}if(['ArrowRight','ArrowDown'].includes(e.key))next=S.step+1;if(['ArrowLeft','ArrowUp'].includes(e.key))next=S.step-1;if(e.key==='Home')next=1;if(e.key==='End')next=m.nodes.length;if(next!==undefined){e.preventDefault();changeStep(next,'node')}}});
}
function changeStep(n,focus){const m=currentMap();S.step=Math.max(1,Math.min(n,m.nodes.length));renderBuild();if(focus){const el=focus==='node'?view.querySelector(`[data-node="${S.step}"]`):$('#'+focus);if(el&&!el.disabled)el.focus({preventScroll:true});else view.querySelector(`[data-node="${S.step}"]`)?.focus({preventScroll:true})}}
function renderReference(){
 const b=D.boards[S.board],skills=[...namedSkills(S.board),...cornerNodes(S.board)],counts=b.nodes.match(/\d+/g)||[];
 view.innerHTML=`<div class="board-layout"><section class="board-main"><div class="board-heading"><div><h1>${b.name}</h1><p>Board reference</p></div><div class="board-count"><strong>${b.unlock}</strong><span>unlock level</span></div></div><div class="map-wrap">${drawMap(S.board,skills,999)}</div>${legend()}</section><aside class="detail reference-detail"><h2>${b.name}</h2><dl><dt>Stat nodes</dt><dd>${counts[0]}</dd><dt>Skill nodes</dt><dd>${counts[1]||0}</dd><dt>Free start</dt><dd>1</dd><dt>Points to fill</dt><dd>${b.fill}</dd></dl><div class="corner-info"><h3>Corner bonuses</h3><p>${E(b.corners)}</p><p>Each corner adds 1.5%.</p></div><h3>${E(b.pool)}</h3><p class="note">${S.board===4?'Separate from the four standard boards. Azphel has no skill nodes.':'Each new purchase must share a side with an owned node. Stat nodes cost 1, passive skills 2, active skills 3 and corners 4 points.'}</p></aside></div>`;
}
function renderSkill(){
 const skill=D.skills[S.skill],points=skill.positions[S.board],ns=[...namedSkills(S.board).map(n=>({...n,selected:n.skill===S.skill})),...cornerNodes(S.board)];
 view.innerHTML=`<div class="board-layout"><section class="board-main"><div class="board-heading"><div><h1>${D.boards[S.board].name}</h1><p>Skill node positions</p></div><div class="board-count"><strong>${points.length}</strong><span>${points.length===1?'matching node':'matching nodes'}</span></div></div><div class="map-wrap">${drawMap(S.board,ns,999)}</div>${legend()}</section><aside class="detail reference-detail"><p class="kind">${skill.kind==='active'?'Active skill':'Passive skill'}</p><h2>${E(skill.name)}</h2>${points.length?points.map(([x,y])=>`<div style="margin:18px 0"><p class="direction">${directions(x,y)}</p><p class="muted">Row ${y+8}, column ${x+8}</p></div>`).join(''):`<p class="note" style="margin:18px 0">This board has no ${E(skill.name)} node. Choose another board.</p>`}<p class="note">Each matching node adds 1 skill level. Across the four boards, each skill has 4 nodes. Board bonuses alone reach level 14.</p></aside></div>`;
}
function pagination(total){const pp=perPage(),pages=Math.max(1,Math.ceil(total/pp));S.page=Math.min(S.page,pages-1);return `<div class="pager"><button id="pageprev" ${S.page===0?'disabled':''}>Previous</button><span>${S.page+1} / ${pages}</span><button id="pagenext" ${S.page===pages-1?'disabled':''}>Next</button></div>`}
function wirePager(){if($('#pageprev'))$('#pageprev').onclick=()=>{S.page--;renderContent();$('#pageprev')?.focus({preventScroll:true})};if($('#pagenext'))$('#pagenext').onclick=()=>{S.page++;renderContent();$('#pagenext')?.focus({preventScroll:true})}}
function renderWeights(){
 const all=[...D.weights[S.weights]],col={healer:0,damage:1,pvp:2}[S.sort];if(col!==undefined)all.sort((a,b)=>b.values[col]-a.values[col]);
 const pager=pagination(all.length),pp=perPage(),rows=all.slice(S.page*pp,(S.page+1)*pp),max=Math.max(...all.flatMap(r=>r.values));
 view.innerHTML=`<section class="page-layout"><div class="page-heading"><div><h1>${S.weights==='Skills'?'Skill priorities':'Stat priorities'}</h1><p>${S.weights==='Skills'?'Weight per +1 skill level.':'Weight per typical stat node.'} These are source priorities, not measured healing or damage.</p><div class="chart-key"><span>PvE healer</span><span>PvE damage</span><span>PvP</span></div></div></div><div class="chart-space">${rows.map(r=>`<div class="chart-row"><div class="chart-label">${E(r.name)}</div><div class="barset">${r.values.map((v,i)=>`<div class="barline" aria-label="${['PvE healer','PvE damage','PvP'][i]} weight ${v}"><div class="bartrack"><span class="barfill" style="width:${v/max*100}%"></span></div><output>${v}</output></div>`).join('')}</div></div>`).join('')}</div>${pager}</section>`;wirePager();
}
function renderSummary(){
 const c=cfg();let content='',pager='';
 if(S.summaryTab==='Allocation'){
  const palette=['#c7ad72','#8cb9d4','#afa0c9','#82928c'];let offset=0;
  const ring=c.alloc.map(([n,v],i)=>{const frac=v/c.budget*100;const circle=`<circle cx="150" cy="150" r="105" pathLength="100" fill="none" stroke="${palette[i]}" stroke-width="12" stroke-dasharray="${Math.max(.1,frac-1.2)} ${100-frac+1.2}" stroke-dashoffset="${-offset}" transform="rotate(-90 150 150)"><title>${n}: ${v} points</title></circle>`;offset+=frac;return circle}).join('');
  content=`<div class="allocation"><svg viewBox="0 0 300 300" role="img" aria-label="${c.budget} points allocated across ${c.alloc.length} boards">${ring}<text x="150" y="152" font-size="57">${c.budget}</text><text x="150" y="179" font-size="15" fill="#8b969e">points allocated</text></svg><div class="allocation-list">${c.alloc.map(([n,v],i)=>`<div class="alloc-row"><span>${n}</span><span style="color:${palette[i]}">${v}</span><div class="bartrack"><span class="barfill" style="width:${v/c.budget*100}%;background:${palette[i]}"></span></div></div>`).join('')}<p class="summary-note">Source priority score ${c.value}. Scores use different weights for each role and do not measure build performance.</p></div></div>`;
 } else if(S.summaryTab==='Skills'){
  pager=pagination(c.skills.length);const rows=c.skills.slice(S.page*perPage(),(S.page+1)*perPage());
  content=c.skills.length?`<div class="chart-space">${rows.map(([n,l,g])=>`<div class="chart-row"><div class="chart-label">${E(n)}<small>+${g} from boards</small></div><div><div style="text-align:right;margin-bottom:6px;font-size:18px;color:var(--blue)">${l} <small>/ 14</small></div><div class="skill-strip" aria-label="Level ${l} of 14">${Array.from({length:14},(_,i)=>`<i class="${i<10?'base':i<l?'gain':''}"></i>`).join('')}</div></div></div>`).join('')}</div>`:`<div class="chart-space"><p class="empty">Azphel has no skill nodes.</p></div>`;
 } else {
  pager=pagination(c.stats.length);const rows=c.stats.slice(S.page*perPage(),(S.page+1)*perPage());content=`<div class="chart-space">${rows.map(t=>{const m=t.match(/^(.*?) (\+[\d.]+%?)$/);return `<div class="chart-row"><div class="chart-label">${E(m?m[1]:t)}</div><div class="stat-value">${m?m[2]:''}</div></div>`}).join('')}</div>`;
 }
 view.innerHTML=`<section class="page-layout"><div class="page-heading"><div><h1>${E(c.label.replace(' · ',' / '))}</h1><p>${S.config>=4?'The source publishes totals for this budget, without a purchase map.':'Full-build totals across the allocated boards.'}</p></div>${switchButtons(['Allocation','Skills','Stats'],S.summaryTab,'data-summary')}</div>${content}${pager||'<div class="pager"><span>All points allocated</span></div>'}</section>`;
 view.querySelectorAll('[data-summary]').forEach(el=>el.onclick=()=>{S.summaryTab=el.dataset.summary;S.page=0;renderSummary()});wirePager();
}
function renderContent(){if(S.mode==='build')renderBuild();else if(S.mode==='reference')renderReference();else if(S.mode==='skill')renderSkill();else renderWeights()}
function render(){renderToolbar();renderContent();document.querySelectorAll('[data-mode]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.mode===S.mode)))}
document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{S.mode=el.dataset.mode;S.page=0;render()});
$('.brand').onclick=e=>{e.preventDefault();S.mode='build';S.config=0;S.board=0;S.summary=false;S.step=27;S.page=0;render()};
$('#motion').onclick=()=>{const stopped=document.body.classList.toggle('still');$('#motion').textContent=stopped?'Resume motion':'Pause motion';$('#motion').setAttribute('aria-pressed',String(stopped));try{localStorage.setItem('cleric-atlas-motion',stopped?'paused':'playing')}catch{}};
try{if(localStorage.getItem('cleric-atlas-motion')==='paused')$('#motion').click()}catch{}
let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{S.page=0;render()},100)});
render();
</script></body></html>
